<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>بنك الأسئلة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">

  <style>
    :root {
      --bg: #f6f8fa; --surface: #ffffff; --surface-2: #f6f8fa;
      --fg: #1f2328; --muted: #59636e; --border: #d1d9e0;
      --accent: #0969da; --accent-fg: #ffffff;
      --danger: #cf222e; --ok: #1a7f37;
      --shadow: rgba(31, 35, 40, .10);
      --font-body: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0d1117; --surface: #151b23; --surface-2: #0d1117;
        --fg: #e6edf3; --muted: #9198a1; --border: #3d444d;
        --accent: #4493f8; --accent-fg: #0d1117;
        --danger: #f85149; --ok: #3fb950;
        --shadow: rgba(0, 0, 0, .45);
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg: #0d1117; --surface: #151b23; --surface-2: #0d1117;
      --fg: #e6edf3; --muted: #9198a1; --border: #3d444d;
      --accent: #4493f8; --accent-fg: #0d1117;
      --danger: #f85149; --ok: #3fb950;
      --shadow: rgba(0, 0, 0, .45);
      color-scheme: dark;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { min-height: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--fg);
      font-family: var(--font-body); font-size: 16px; line-height: 1.7;
    }
    [hidden] { display: none !important; }
    button { font: inherit; color: inherit; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* ---------- تحميل ---------- */
    .boot { min-height: 100vh; display: grid; place-items: center; padding: 32px 16px; }
    .loading { display: grid; justify-items: center; gap: 16px; color: var(--muted); font-size: 15px; text-align: center; }
    .loading p { margin: 0; }
    .loading strong { color: var(--fg); font-weight: 600; display: block; margin-bottom: 4px; font-size: 16px; }
    .loader {
      width: 34px; height: 34px; border-radius: 50%;
      border: 3px solid var(--border); border-top-color: var(--accent);
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---------- الشريط العلوي (ثابت) ---------- */
    .topbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 40;
      height: calc(64px + env(safe-area-inset-top, 0px));
      padding: env(safe-area-inset-top, 0px) 18px 0;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      border-radius: 0 0 24px 24px;
      box-shadow: 0 8px 20px var(--shadow);
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; }
    .brand svg { width: 28px; height: 28px; color: var(--accent); }
    .brand span { font-size: 18px; }

    .icon-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 42px; height: 42px; border-radius: 12px;
      border: 1px solid transparent; background: transparent; color: var(--fg); cursor: pointer;
    }
    .icon-btn:hover { background: var(--surface-2); border-color: var(--border); }
    .icon-btn svg { width: 22px; height: 22px; }

    /* ---------- المحتوى ---------- */
    .main {
      max-width: 720px; margin: 0 auto;
      padding: calc(64px + env(safe-area-inset-top, 0px) + 22px) 16px calc(84px + env(safe-area-inset-bottom, 0px) + 20px);
    }
    .greet { margin: 0 0 18px; font-size: 20px; line-height: 1.5; overflow-wrap: anywhere; }
    .page-title { display: flex; align-items: center; gap: 10px; margin: 0 0 16px; font-size: 20px; }
    .page-title svg { width: 24px; height: 24px; color: var(--accent); flex: none; }

    .empty {
      border: 1px dashed var(--border); border-radius: 14px; background: var(--surface);
      padding: 36px 18px; text-align: center; color: var(--muted); font-size: 15px;
    }
    .empty p { margin: 0; }

    /* ---------- الأزرار ---------- */
    .btn-primary, .btn-ghost, .btn-danger {
      border-radius: 10px; padding: 11px 18px; font-weight: 600; font-size: 15px; cursor: pointer;
      border: 1px solid transparent;
    }
    .btn-primary { background: var(--accent); color: var(--accent-fg); }
    .btn-primary:hover { filter: brightness(1.08); }
    .btn-ghost { background: var(--surface-2); border-color: var(--border); color: var(--fg); }
    .btn-ghost:hover { border-color: var(--muted); }
    .btn-danger { background: transparent; border-color: var(--danger); color: var(--danger); }
    .btn-danger:hover { background: var(--danger); color: #fff; }
    button[disabled] { opacity: .6; cursor: not-allowed; }

    /* ---------- كروت الامتحانات ---------- */
    .exam-list { display: grid; gap: 14px; }
    .exam {
      width: 100%; text-align: start; cursor: pointer;
      background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
      padding: 16px; display: flex; flex-direction: column; gap: 12px;
      box-shadow: 0 2px 8px var(--shadow);
    }
    .exam:hover { border-color: var(--accent); }
    .exam-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .exam-title { font-weight: 600; font-size: 18px; overflow-wrap: anywhere; }
    .chip {
      flex: none; font-size: 12.5px; font-weight: 600; padding: 2px 10px; border-radius: 999px;
      border: 1px solid var(--border); color: var(--muted); background: var(--surface-2);
    }
    .chip.open { color: var(--ok); border-color: var(--ok); }
    .chip.done { color: var(--accent); border-color: var(--accent); }
    .info { display: grid; gap: 4px; }
    .row { display: flex; gap: 6px; flex-wrap: wrap; font-size: 14.5px; }
    .row .k { color: var(--muted); }
    .row .v { font-weight: 500; }
    .exam-line {
      border-top: 1px solid var(--border); padding-top: 10px;
      font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums;
    }

    /* ---------- نافذة في نص الشاشة ---------- */
    .modal-back {
      position: fixed; inset: 0; z-index: 80; background: rgba(0, 0, 0, .55);
      display: grid; place-items: center; padding: 16px;
    }
    .modal {
      width: min(400px, 100%); max-height: 90vh; overflow: auto;
      background: var(--surface); border: 1px solid var(--border); border-radius: 18px;
      padding: 22px 20px; display: grid; gap: 14px; box-shadow: 0 16px 40px var(--shadow);
    }
    .modal h2 { margin: 0; font-size: 20px; text-align: center; }
    .modal .sub { margin: 0; text-align: center; color: var(--muted); font-size: 15px; }
    .modal .actions { display: grid; gap: 8px; margin-top: 4px; }
    .result-score { text-align: center; font-size: 34px; font-weight: 600; line-height: 1.3; }
    .result-note { text-align: center; font-weight: 600; }
    .result-note.ok { color: var(--ok); }
    .result-note.no { color: var(--danger); }

    /* ---------- شاشة الامتحان ---------- */
    .exam-screen { position: fixed; inset: 0; z-index: 70; background: var(--bg); display: flex; flex-direction: column; }
    .exam-top {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 12px;
      background: var(--surface); border-bottom: 1px solid var(--border);
      border-radius: 0 0 20px 20px; box-shadow: 0 6px 16px var(--shadow);
    }
    .exam-top strong { display: block; font-size: 17px; overflow-wrap: anywhere; }
    .exam-top small { color: var(--muted); font-size: 13px; }
    .exam-timer {
      font-variant-numeric: tabular-nums; font-weight: 600; font-size: 18px; direction: ltr;
      padding: 4px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-2); flex: none;
    }
    .exam-timer.low { color: var(--danger); border-color: var(--danger); }
    .exam-body { flex: 1; overflow: auto; padding: 16px; display: grid; gap: 14px; align-content: start; max-width: 720px; width: 100%; margin: 0 auto; }
    .q {
      background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px; display: grid; gap: 12px;
    }
    .q-body { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
    .q-body small { color: var(--muted); font-weight: 500; margin-inline-end: 6px; }
    .opts { display: grid; gap: 8px; }
    .opt {
      text-align: start; cursor: pointer; display: flex; align-items: center; gap: 10px;
      padding: 11px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-2);
      overflow-wrap: anywhere;
    }
    .opt .dot { flex: none; width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--border); }
    .opt[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--surface)); }
    .opt[aria-pressed="true"] .dot { border-color: var(--accent); background: radial-gradient(circle, var(--accent) 45%, transparent 50%); }
    .exam-foot {
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
      background: var(--surface); border-top: 1px solid var(--border);
      border-radius: 20px 20px 0 0; box-shadow: 0 -6px 16px var(--shadow);
    }
    .exam-foot .btn-primary { width: 100%; max-width: 720px; display: block; margin: 0 auto; }

    /* ---------- الأوائل ---------- */
    .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; }
    .seg button { border: none; background: transparent; padding: 9px; border-radius: 9px; font-weight: 600; font-size: 14.5px; cursor: pointer; color: var(--muted); }
    .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
    .lb-meta { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 4px; }
    .lb-updated { color: var(--muted); font-size: 13px; margin: 6px 0 0; }

    .podium { display: flex; align-items: flex-end; justify-content: center; gap: 10px; margin: 26px 0 22px; }
    .pod { flex: 1; max-width: 150px; display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
    .pod.ghost { visibility: hidden; }
    .pod .avatar { width: 64px; height: 64px; font-size: 22px; border-width: 3px; }
    .pod.p1 .avatar { width: 84px; height: 84px; font-size: 28px; }
    .pod.p1 .avatar { border-color: #d4af37; box-shadow: 0 0 0 4px rgba(212, 175, 55, .18); }
    .pod.p2 .avatar { border-color: #aab2bd; }
    .pod.p3 .avatar { border-color: #cd7f32; }
    .crown { width: 26px; height: 26px; color: #d4af37; margin-bottom: -2px; }
    .pod-name { font-size: 14px; font-weight: 600; text-align: center; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pod-pts { font-size: 12.5px; color: var(--muted); }
    .pod-block {
      width: 100%; border-radius: 12px 12px 0 0; display: grid; place-items: center;
      font-weight: 700; font-size: 24px; color: #3b2a00;
    }
    .p1 .pod-block { height: 110px; background: linear-gradient(#ffe58a, #f1c84b); }
    .p2 .pod-block { height: 82px; background: linear-gradient(#f2f4f7, #cfd5dd); }
    .p3 .pod-block { height: 62px; background: linear-gradient(#f6c79a, #d9915a); }

    .lb-list { display: grid; gap: 8px; }
    .lb-row {
      display: flex; align-items: center; gap: 12px; padding: 10px 12px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    }
    .lb-row.me { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
    .lb-rank { width: 38px; flex: none; text-align: center; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
    .lb-name { flex: 1; min-width: 0; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lb-pts { flex: none; font-weight: 600; font-variant-numeric: tabular-nums; }
    .lb-pts small { color: var(--muted); font-weight: 500; margin-inline-start: 4px; }
    .lb-sep { text-align: center; color: var(--muted); letter-spacing: 4px; margin: 2px 0; }

    /* ---------- الصور ---------- */
    .avatar {
      display: grid; place-items: center; flex: none; overflow: hidden;
      width: 40px; height: 40px; border-radius: 50%;
      background: var(--surface-2); border: 1px solid var(--border);
      font-weight: 600; color: var(--fg);
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .avatar.lg { width: 88px; height: 88px; font-size: 32px; }

    /* ---------- الإعدادات ---------- */
    .set-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
      padding: 16px; margin-bottom: 14px; display: grid; gap: 14px;
    }
    .set-title { margin: 0; font-size: 15px; font-weight: 600; color: var(--muted); }
    .profile-top { display: flex; align-items: center; gap: 14px; }
    .profile-name { font-weight: 600; font-size: 18px; overflow-wrap: anywhere; }
    .hint { margin: 2px 0 0; font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
    .hint svg { width: 14px; height: 14px; flex: none; }
    .field { display: grid; gap: 6px; }
    .field label { font-size: 14px; font-weight: 500; }
    .field-row { display: flex; gap: 8px; }
    .input {
      flex: 1; min-width: 0; padding: 11px 12px; border-radius: 10px;
      border: 1px solid var(--border); background: var(--surface-2); color: var(--fg); font: inherit; direction: ltr; text-align: right;
    }
    .input:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
    .field-msg { min-height: 1.4em; margin: 0; font-size: 13px; color: var(--muted); }
    .field-msg.err { color: var(--danger); }

    .swatches { display: flex; flex-wrap: wrap; gap: 10px; }
    .swatch {
      width: 38px; height: 38px; border-radius: 50%; border: 2px solid transparent; cursor: pointer;
      display: grid; place-items: center; color: #fff; padding: 0;
    }
    .swatch svg { width: 18px; height: 18px; opacity: 0; }
    .swatch[aria-pressed="true"] { border-color: var(--fg); box-shadow: 0 0 0 2px var(--surface) inset; }
    .swatch[aria-pressed="true"] svg { opacity: 1; }

    .switch-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; cursor: pointer; user-select: none; }
    .switch-row span.t { font-weight: 500; }
    .switch-row input { position: absolute; opacity: 0; width: 0; height: 0; }
    .switch {
      position: relative; width: 48px; height: 28px; border-radius: 999px;
      background: var(--border); flex: none; transition: background-color .2s ease;
    }
    .switch::after {
      content: ""; position: absolute; top: 3px; inset-inline-start: 3px;
      width: 22px; height: 22px; border-radius: 50%; background: var(--surface);
      box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: inset-inline-start .2s ease;
    }
    .switch-row input:checked + .switch { background: var(--accent); }
    .switch-row input:checked + .switch::after { inset-inline-start: 23px; }
    .switch-row input:focus-visible + .switch { outline: 2px solid var(--accent); outline-offset: 2px; }

    .account { display: flex; align-items: center; gap: 14px; }
    .account .who { flex: 1; min-width: 0; }
    .account .who strong { display: block; overflow-wrap: anywhere; }
    .account .who small { color: var(--muted); }
    .logout-btn { display: inline-flex; align-items: center; gap: 8px; }
    .logout-btn svg { width: 18px; height: 18px; }

    /* ---------- الشريط السفلي (ثابت) ---------- */
    .bottom-nav {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
      display: flex; justify-content: space-around; align-items: center;
      padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
      background: var(--surface); border-top: 1px solid var(--border);
      border-radius: 24px 24px 0 0; box-shadow: 0 -8px 20px var(--shadow);
    }
    .nav-btn {
      position: relative; width: 62px; height: 48px; border: none; background: transparent;
      color: var(--muted); border-radius: 16px; display: grid; place-items: center; cursor: pointer;
      transition: background-color .15s ease, color .15s ease;
    }
    .nav-btn svg { width: 26px; height: 26px; }
    .nav-btn.active { color: var(--accent); background: var(--surface-2); background: color-mix(in srgb, var(--accent) 14%, transparent); }
    /* اسم الأيقونة: بيظهر لما تقف عليها وبيختفي لما تمشي */
    .nav-btn::after {
      content: attr(data-label); position: absolute; bottom: calc(100% + 12px); left: 50%;
      transform: translateX(-50%) translateY(4px); white-space: nowrap;
      background: var(--fg); color: var(--bg); font-size: 13px; font-weight: 500;
      padding: 5px 10px; border-radius: 8px; opacity: 0; pointer-events: none;
      transition: opacity .15s ease, transform .15s ease;
    }
    .nav-btn.tip-on::after, .nav-btn:focus-visible::after { opacity: 1; transform: translateX(-50%) translateY(0); }
    @media (hover: hover) {
      .nav-btn:hover::after { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    /* ---------- رسالة سريعة ---------- */
    .toast {
      position: fixed; left: 50%; transform: translateX(-50%); z-index: 90;
      bottom: calc(96px + env(safe-area-inset-bottom, 0px));
      background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 12px;
      font-size: 14.5px; max-width: calc(100vw - 32px); text-align: center;
    }
    .toast.err { background: var(--danger); color: #fff; }

    @media (prefers-reduced-motion: reduce) {
      .loader { animation-duration: 2s; }
      * { transition: none !important; }
    }
  </style>

  <script>
    // الوضع الفاتح / الداكن ولون الأزرار (بيتطبقوا بدري عشان مفيش وميض)
    (function () {
      var ACCENTS = [
        { id: "blue",   name: "أزرق",    light: "#0969da", dark: "#4493f8" },
        { id: "green",  name: "أخضر",    light: "#1a7f37", dark: "#3fb950" },
        { id: "purple", name: "بنفسجي",  light: "#8250df", dark: "#a371f7" },
        { id: "orange", name: "برتقالي", light: "#bc4c00", dark: "#f0883e" },
        { id: "pink",   name: "وردي",    light: "#bf3989", dark: "#f778ba" },
        { id: "teal",   name: "تركواز",  light: "#0e7c86", dark: "#39c5cf" },
        { id: "red",    name: "أحمر",    light: "#cf222e", dark: "#ff7b72" }
      ];
      function isDark() {
        var t = document.documentElement.getAttribute("data-theme");
        if (t) return t === "dark";
        return !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
      }
      function currentAccent() {
        var id = "blue";
        try { id = localStorage.getItem("qb-accent") || "blue"; } catch (e) {}
        for (var i = 0; i < ACCENTS.length; i++) if (ACCENTS[i].id === id) return ACCENTS[i];
        return ACCENTS[0];
      }
      function applyAccent() {
        var a = currentAccent(), dark = isDark(), s = document.documentElement.style;
        s.setProperty("--accent", dark ? a.dark : a.light);
        s.setProperty("--accent-fg", dark ? "#0d1117" : "#ffffff");
      }
      window.QB = { ACCENTS: ACCENTS, isDark: isDark, applyAccent: applyAccent, currentAccent: currentAccent };
      try {
        var saved = localStorage.getItem("qb-theme");
        if (saved === "dark" || saved === "light") document.documentElement.setAttribute("data-theme", saved);
      } catch (e) {}
      applyAccent();
      if (window.matchMedia) {
        var mq = window.matchMedia("(prefers-color-scheme: dark)");
        var onChange = function () { applyAccent(); };
        if (mq.addEventListener) mq.addEventListener("change", onChange);
      }
    })();
  </script>
</head>
<body>

  <!-- تحميل: بنجيب بيانات الطالب من Supabase قبل ما ندخّله -->
  <div class="boot" id="bootView">
    <div class="loading">
      <div class="loader" aria-hidden="true"></div>
      <p><strong>ثانية واحدة...</strong><span>بنتأكد من حسابك</span></p>
    </div>
  </div>

  <div id="appView" hidden>
    <header class="topbar">
      <div class="brand">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M4 21.5V5.5"/><path d="M9 8.5h7M9 12h5"/></svg>
        <span>بنك الأسئلة</span>
      </div>
      <button class="icon-btn" id="themeBtn" type="button" aria-label="تبديل الوضع"></button>
    </header>

    <main class="main">
      <!-- الرئيسية -->
      <section id="pageHome">
        <h1 class="greet" id="greet"></h1>
        <div class="exam-list" id="examList"></div>
        <div class="empty" id="examEmpty" hidden><p id="examEmptyText"></p></div>
      </section>

      <!-- الأوائل -->
      <section id="pageLeaders" hidden>
        <h1 class="page-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>
          الأوائل
        </h1>
        <div class="seg" role="group" aria-label="الفترة">
          <button type="button" id="perMonth" aria-pressed="true">الشهر الحالي</button>
          <button type="button" id="perAll" aria-pressed="false">كل الأوقات</button>
        </div>

      <!-- الإعدادات -->
      <section id="pageSettings" hidden>
        <h1 class="page-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h8M18 6h2"/><circle cx="15" cy="6" r="2.5"/><path d="M4 12h2M12 12h8"/><circle cx="9" cy="12" r="2.5"/><path d="M4 18h9M19 18h1"/><circle cx="16" cy="18" r="2.5"/></svg>
          الإعدادات
        </h1>

        <div class="set-card">
          <div class="profile-top">
            <span id="setAvatar"></span>
            <div>
              <div class="profile-name" id="setName"></div>
              <p class="hint">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
                الاسم من حساب جوجل ومينفعش يتغير
              </p>
            </div>
          </div>
          <input type="file" id="avatarFile" accept="image/*" hidden>
          <button class="btn-ghost" id="avatarBtn" type="button">تغيير الصورة</button>

          <div class="field">
            <label for="phone">رقم التليفون</label>
            <div class="field-row">
              <input class="input" id="phone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="01xxxxxxxxx" maxlength="11">
              <button class="btn-primary" id="phoneSave" type="button">حفظ</button>
            </div>
            <p class="field-msg" id="phoneMsg"></p>
          </div>
        </div>

        <div class="set-card">
          <h2 class="set-title">لون الأزرار</h2>
          <div class="swatches" id="swatches"></div>
        </div>

        <div class="set-card">
          <label class="switch-row" for="darkSwitch">
            <span class="t">الوضع الداكن</span>
            <input type="checkbox" id="darkSwitch">
            <span class="switch" aria-hidden="true"></span>
          </label>
        </div>

        <div class="set-card">
          <div class="account">
            <span id="accAvatar"></span>
            <div class="who"><strong id="accName"></strong></div>
          </div>
          <button class="btn-danger logout-btn" id="logoutBtn" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5V3h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>
            تسجيل الخروج
          </button>
        </div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="التنقل">
      <button class="nav-btn active" type="button" data-page="home" data-label="الصفحة الرئيسية" aria-label="الصفحة الرئيسية">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>
      </button>
      <button class="nav-btn" type="button" data-page="leaders" data-label="الأوائل" aria-label="الأوائل">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>
      </button>
      <button class="nav-btn" type="button" data-page="settings" data-label="الإعدادات" aria-label="الإعدادات">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h8M18 6h2"/><circle cx="15" cy="6" r="2.5"/><path d="M4 12h2M12 12h8"/><circle cx="9" cy="12" r="2.5"/><path d="M4 18h9M19 18h1"/><circle cx="16" cy="18" r="2.5"/></svg>
      </button>
    </nav>
  </div>

  <!-- شاشة الامتحان -->
  <div class="exam-screen" id="examScreen" hidden>
    <div class="exam-top">
      <div>
        <strong id="exSubject"></strong>
        <small id="exProgress"></small>
      </div>
      <div class="exam-timer" id="exTimer">00:00</div>
    </div>
    <div class="exam-body" id="exBody"></div>
    <div class="exam-foot">
      <button class="btn-primary" id="exSubmit" type="button">تسليم الامتحان</button>
    </div>
  </div>

  <!-- نافذة في نص الشاشة -->
  <div class="modal-back" id="modal" hidden>
    <div class="modal" id="modalBox" role="dialog" aria-modal="true"></div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script>
    var SUPABASE_URL = "https://gcumvhqxcbgtedqnuzvr.supabase.co";
    var SUPABASE_ANON_KEY = "sb_publishable_p95Q2a4chqmwS10ht5edMg_LfTqWQwA";

    // اسم صفحة تسجيل الدخول (الملف التاني)
    var LOGIN_PAGE = "index.html";

    (function () {
      "use strict";

      /* ============ أدوات صغيرة ============ */
      const $ = (id) => document.getElementById(id);
      const h = (tag, cls, text) => {
        const e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text != null) e.textContent = text;
        return e;
      };
      const AR_DIGITS = "٠١٢٣٤٥٦٧٨٩";
      const ar = (v) => String(v).replace(/\d/g, (d) => AR_DIGITS[d]);
      const TZ = "Africa/Cairo";
      const fDate = new Intl.DateTimeFormat("ar-EG", { timeZone: TZ, weekday: "long", day: "numeric", month: "long", year: "numeric" });
      const fTime = new Intl.DateTimeFormat("ar-EG", { timeZone: TZ, hour: "numeric", minute: "2-digit" });
      const fStamp = new Intl.DateTimeFormat("ar-EG", { timeZone: TZ, day: "numeric", month: "numeric", year: "numeric", hour: "numeric", minute: "2-digit" });

      function fmtLeft(ms) {
        const s = Math.max(0, Math.floor(ms / 1000));
        const hh = Math.floor(s / 3600), mm = Math.floor((s % 3600) / 60), ss = s % 60;
        const p = (n) => String(n).padStart(2, "0");
        return hh > 0 ? p(hh) + ":" + p(mm) + ":" + p(ss) : p(mm) + ":" + p(ss);
      }

      let toastTimer = null;
      function toast(msg, isErr) {
        const t = $("toast");
        t.textContent = msg;
        t.className = "toast" + (isErr ? " err" : "");
        t.hidden = false;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => { t.hidden = true; }, 2800);
      }

      function avatarEl(url, name, cls) {
        const wrap = h("span", "avatar" + (cls ? " " + cls : ""));
        const letter = () => { wrap.textContent = (name || "؟").trim().charAt(0); };
        if (url) {
          const img = document.createElement("img");
          img.alt = "";
          img.referrerPolicy = "no-referrer";
          img.addEventListener("error", () => { wrap.textContent = ""; letter(); });
          img.src = url;
          wrap.appendChild(img);
        } else {
          letter();
        }
        return wrap;
      }

      /* ============ Supabase والجلسة ============ */
      const remembered = () => {
        try { return localStorage.getItem("qb-remember") !== "0"; } catch (e) { return true; }
      };
      const authStorage = {
        getItem: (k) => { try { return localStorage.getItem(k) || sessionStorage.getItem(k); } catch (e) { return null; } },
        setItem: (k, v) => {
          try {
            const keep = remembered();
            (keep ? localStorage : sessionStorage).setItem(k, v);
            (keep ? sessionStorage : localStorage).removeItem(k);
          } catch (e) {}
        },
        removeItem: (k) => { try { localStorage.removeItem(k); sessionStorage.removeItem(k); } catch (e) {} }
      };
      const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { storage: authStorage } });

      const goLogin = () => { window.location.replace(new URL(LOGIN_PAGE, window.location.href).href); };

      const me = { id: "", user: null, fullName: "", avatar: "", role: "student" };
      let offset = 0;                                   // فرق الساعة بين السيرفر والتليفون
      const now = () => Date.now() + offset;
      const state = { exams: [], attempts: {}, period: "month", page: "home", cards: {} };

      async function loadProfile() {
        const m = me.user.user_metadata || {};
        me.id = me.user.id;
        me.fullName = m.full_name || m.name || "";
        me.avatar = m.avatar_url || m.picture || "";
        try {
          const r = await sb.from("profiles").select("full_name, avatar_url, role").eq("id", me.id).maybeSingle();
          if (!r.error && r.data) {
            if (r.data.full_name) me.fullName = r.data.full_name;
            if (r.data.avatar_url) me.avatar = r.data.avatar_url;
            me.role = r.data.role || "student";
          }
        } catch (e) {}
      }
      async function syncClock() {
        try {
          const r = await sb.rpc("server_now");
          if (!r.error && r.data) {
            const t = new Date(r.data).getTime();
            if (!isNaN(t)) offset = t - Date.now();
          }
        } catch (e) {}
      }

      /* ============ الوضع الفاتح / الداكن ============ */
      const themeBtn = $("themeBtn");
      const darkSwitch = $("darkSwitch");
      const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>';
      const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';

      function paintTheme() {
        const dark = window.QB.isDark();
        themeBtn.innerHTML = dark ? SUN : MOON;
        darkSwitch.checked = dark;
      }
      function setTheme(next) {
        document.documentElement.setAttribute("data-theme", next);
        try { localStorage.setItem("qb-theme", next); } catch (e) {}
        window.QB.applyAccent();
        paintTheme();
      }
      themeBtn.addEventListener("click", () => setTheme(window.QB.isDark() ? "light" : "dark"));
      darkSwitch.addEventListener("change", () => setTheme(darkSwitch.checked ? "dark" : "light"));
      paintTheme();

      /* ============ نافذة في نص الشاشة ============ */
      let modalLocked = false;
      function openModal(build, locked) {
        const box = $("modalBox");
        box.innerHTML = "";
        build(box);
        modalLocked = !!locked;
        $("modal").hidden = false;
      }
      function closeModal() { $("modal").hidden = true; }
      $("modal").addEventListener("click", (e) => { if (e.target === $("modal") && !modalLocked) closeModal(); });
      document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !modalLocked) closeModal(); });

      /* ============ التنقل (الشريط السفلي) ============ */
      const pages = { home: $("pageHome"), leaders: $("pageLeaders"), settings: $("pageSettings") };
      const navBtns = Array.prototype.slice.call(document.querySelectorAll(".nav-btn"));

      function go(page, skipScroll) {
        if (!pages[page]) page = "home";
        state.page = page;
        Object.keys(pages).forEach((k) => { pages[k].hidden = k !== page; });
        navBtns.forEach((b) => {
          const on = b.dataset.page === page;
          b.classList.toggle("active", on);
          if (on) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
        });
        try { history.replaceState(null, "", "#" + page); } catch (e) {}
        if (!skipScroll) window.scrollTo(0, 0);
        if (page === "home") loadExams();
        if (page === "leaders") loadLeaders();
        if (page === "settings") renderSettings();
      }
      navBtns.forEach((b) => {
        let tipTimer = null;
        b.addEventListener("click", () => {
          b.classList.add("tip-on");
          clearTimeout(tipTimer);
          tipTimer = setTimeout(() => b.classList.remove("tip-on"), 1300);
          go(b.dataset.page);
        });
        b.addEventListener("mouseleave", () => { clearTimeout(tipTimer); b.classList.remove("tip-on"); });
        b.addEventListener("blur", () => { clearTimeout(tipTimer); b.classList.remove("tip-on"); });
      });

      /* ============ الرئيسية: الامتحانات ============ */
      function infoRows(exam) {
        const box = h("div", "info");
        const subjAt = new Date(exam.subject_at || exam.starts_at);
        const add = (k, v) => {
          const r = h("div", "row");
          r.appendChild(h("span", "k", k));
          r.appendChild(h("span", "v", v));
          box.appendChild(r);
        };
        add("اسم المادة:", exam.subject);
        add("تاريخ ووقت المادة:", fDate.format(subjAt) + " · " + fTime.format(subjAt));
        add("اسم الدكتور:", exam.doctor);
        add("بداية الامتحان الساعة:", fTime.format(new Date(exam.starts_at)));
        add("نهاية الامتحان الساعة:", fTime.format(new Date(exam.ends_at)));
        return box;
      }

      function examStatus(exam) {
        const t = now();
        const att = state.attempts[exam.id];
        if (att && att.submitted_at) return "done";
        if (t >= new Date(exam.ends_at).getTime()) return "ended";
        if (t < new Date(exam.starts_at).getTime()) return "soon";
        return "open";
      }

      function updateCard(ref) {
        const exam = ref.exam;
        const st = examStatus(exam);
        const t = now();
        ref.status = st;
        ref.chip.className = "chip" + (st === "open" ? " open" : st === "done" ? " done" : "");
        if (st === "done") {
          const a = state.attempts[exam.id];
          ref.chip.textContent = "تم التسليم";
          ref.line.textContent = "درجتك: " + ar(a.score) + " من " + ar(a.total) + (a.passed ? " · ناجح" : " · لم تنجح");
        } else if (st === "soon") {
          ref.chip.textContent = "قريباً";
          ref.line.textContent = "يبدأ بعد " + ar(fmtLeft(new Date(exam.starts_at).getTime() - t));
        } else if (st === "open") {
          ref.chip.textContent = "متاح الآن";
          ref.line.textContent = "باقي على النهاية " + ar(fmtLeft(new Date(exam.ends_at).getTime() - t));
        }
      }

      function showEmpty() {
        const t = now();
        const missed = state.exams.some((e) => {
          const att = state.attempts[e.id];
          return new Date(e.ends_at).getTime() <= t && !(att && att.submitted_at);
        });
        $("examEmptyText").textContent = missed
          ? "تم انتهاء الامتحان، استنى الامتحان القادم."
          : "مفيش امتحانات دلوقتي.";
        $("examEmpty").hidden = false;
      }

      function renderExams() {
        const list = $("examList");
        list.innerHTML = "";
        state.cards = {};
        $("examEmpty").hidden = true;

        const shown = state.exams.filter((e) => new Date(e.ends_at).getTime() > now());
        if (!shown.length) { showEmpty(); return; }

        shown.forEach((exam) => {
          const card = h("button", "exam");
          card.type = "button";
          const head = h("div", "exam-head");
          head.appendChild(h("span", "exam-title", exam.subject));
          const chip = h("span", "chip");
          head.appendChild(chip);
          card.appendChild(head);
          card.appendChild(infoRows(exam));
          const line = h("div", "exam-line");
          card.appendChild(line);
          card.addEventListener("click", () => showExamModal(exam));
          list.appendChild(card);
          const ref = { exam, card, chip, line, status: "" };
          state.cards[exam.id] = ref;
          updateCard(ref);
        });
      }

      async function loadExams() {
        let exams = [];
        const attempts = {};
        try {
          const since = new Date(now() - 24 * 3600 * 1000).toISOString();
          const r = await sb.from("exams").select("*").gt("ends_at", since).order("starts_at", { ascending: true });
          if (!r.error && r.data) exams = r.data;
        } catch (e) {}
        try {
          const a = await sb.from("attempts").select("exam_id, submitted_at, score, total, passed").eq("user_id", me.id);
          if (!a.error && a.data) a.data.forEach((x) => { attempts[x.exam_id] = x; });
        } catch (e) {}
        state.exams = exams;
        state.attempts = attempts;
        renderExams();
      }

      // كل ثانية: نحدّث العدّاد، ولو الامتحان خلص من غير ما أدخله يتشال من الصفحة
      setInterval(() => {
        if (state.page !== "home") return;
        let removed = false;
        Object.keys(state.cards).forEach((id) => {
          const ref = state.cards[id];
          updateCard(ref);
          if (ref.status === "ended") {
            ref.card.remove();
            delete state.cards[id];
            removed = true;
          }
        });
        if (removed && !Object.keys(state.cards).length) showEmpty();
      }, 1000);

      document.addEventListener("visibilitychange", () => {
        if (!document.hidden && state.page === "home" && $("examScreen").hidden) loadExams();
      });

      const START_ERRORS = {
        exam_not_started: "الامتحان لسه ما بدأش.",
        exam_ended: "تم انتهاء الامتحان.",
        already_submitted: "أنت سلّمت الامتحان ده قبل كده.",
        exam_not_found: "الامتحان ده مش موجود."
      };
      function errText(err, map, fallback) {
        const msg = (err && err.message) || "";
        for (const k in map) if (msg.indexOf(k) !== -1) return map[k];
        return fallback;
      }

      function showExamModal(exam) {
        const st = examStatus(exam);
        if (st === "ended") { loadExams(); return; }
        const att = state.attempts[exam.id];

        openModal((box) => {
          if (st === "done") {
            box.appendChild(h("h2", null, "تم تسليم الامتحان"));
            box.appendChild(h("p", "sub", exam.subject));
            box.appendChild(h("div", "result-score", ar(att.score) + " / " + ar(att.total)));
            box.appendChild(h("div", "result-note " + (att.passed ? "ok" : "no"), att.passed ? "ناجح" : "لم تنجح"));
            const actions = h("div", "actions");
            const ok = h("button", "btn-ghost", "تمام");
            ok.type = "button";
            ok.addEventListener("click", closeModal);
            actions.appendChild(ok);
            box.appendChild(actions);
            return;
          }

          box.appendChild(h("h2", null, "ابدأ الامتحان"));
          box.appendChild(h("p", "sub", exam.subject));
          box.appendChild(infoRows(exam));

          const actions = h("div", "actions");
          const enter = h("button", "btn-primary", "ادخل");
          enter.type = "button";
          if (st === "soon") { enter.disabled = true; enter.textContent = "لسه ما بدأش"; }
          enter.addEventListener("click", async () => {
            enter.disabled = true;
            enter.textContent = "ثانية واحدة...";
            let res = null;
            try { res = await sb.rpc("start_exam", { p_exam_id: exam.id }); } catch (e) { res = { error: e }; }
            if (res.error) {
              toast(errText(res.error, START_ERRORS, "ماقدرناش نفتح الامتحان، جرّب تاني."), true);
              closeModal();
              loadExams();
              return;
            }
            closeModal();
            openExam(exam, res.data);
          });
          const cancel = h("button", "btn-ghost", "إلغاء");
          cancel.type = "button";
          cancel.addEventListener("click", closeModal);
          actions.appendChild(enter);
          actions.appendChild(cancel);
          box.appendChild(actions);
        });
      }

      /* ============ شاشة الامتحان ============ */
      const cur = { exam: null, questions: [], answers: {}, endsAt: 0, timer: null, submitting: false };
      const draftKey = () => "qb-draft-" + me.id + "-" + cur.exam.id;

      function updateProgress() {
        const done = cur.questions.filter((q) => cur.answers[q.id] != null).length;
        $("exProgress").textContent = "اتجاوب " + ar(done) + " من " + ar(cur.questions.length);
      }

      function openExam(exam, data) {
        cur.exam = exam;
        cur.questions = (data && data.questions) || [];
        cur.endsAt = new Date((data && data.ends_at) || exam.ends_at).getTime();
        cur.submitting = false;
        cur.answers = {};
        try { cur.answers = JSON.parse(localStorage.getItem(draftKey()) || "{}") || {}; } catch (e) {}

        $("exSubject").textContent = exam.subject;
        const body = $("exBody");
        body.innerHTML = "";

        if (!cur.questions.length) {
          const empty = h("div", "empty");
          empty.appendChild(h("p", null, "الامتحان لسه مفيهوش أسئلة."));
          body.appendChild(empty);
          $("exSubmit").textContent = "رجوع";
        } else {
          $("exSubmit").textContent = "تسليم الامتحان";
          cur.questions.forEach((q, i) => {
            const card = h("div", "q");
            const qb = h("p", "q-body");
            qb.appendChild(h("small", null, ar(i + 1) + "."));
            qb.appendChild(document.createTextNode(q.body));
            card.appendChild(qb);
            const opts = h("div", "opts");
            (q.options || []).forEach((txt, idx) => {
              const o = h("button", "opt");
              o.type = "button";
              o.appendChild(h("span", "dot"));
              o.appendChild(h("span", null, String(txt)));
              o.setAttribute("aria-pressed", cur.answers[q.id] === idx ? "true" : "false");
              o.addEventListener("click", () => {
                cur.answers[q.id] = idx;
                Array.prototype.forEach.call(opts.children, (c, ci) => c.setAttribute("aria-pressed", ci === idx ? "true" : "false"));
                try { localStorage.setItem(draftKey(), JSON.stringify(cur.answers)); } catch (e) {}
                updateProgress();
              });
              opts.appendChild(o);
            });
            card.appendChild(opts);
            body.appendChild(card);
          });
        }
        updateProgress();
        $("examScreen").hidden = false;
        document.body.style.overflow = "hidden";
        body.scrollTop = 0;

        clearInterval(cur.timer);
        tickExam();
        cur.timer = setInterval(tickExam, 1000);
      }

      function tickExam() {
        const left = cur.endsAt - now();
        const t = $("exTimer");
        t.textContent = ar(fmtLeft(left));
        t.classList.toggle("low", left <= 60000);
        if (left <= 0 && !cur.submitting) submitExam(true);
      }

      function closeExamScreen() {
        clearInterval(cur.timer);
        $("examScreen").hidden = true;
        document.body.style.overflow = "";
      }

      const SUBMIT_ERRORS = {
        exam_ended: "الوقت خلص قبل ما التسليم يوصل.",
        already_submitted: "أنت سلّمت الامتحان ده قبل كده.",
        not_started: "الامتحان ده ماتفتحش من الأول."
      };

      async function submitExam(auto) {
        if (cur.submitting) return;
        if (!cur.questions.length) { closeExamScreen(); loadExams(); return; }
        cur.submitting = true;
        $("exSubmit").disabled = true;
        $("exSubmit").textContent = "بنسلّم...";

        let res = null;
        try { res = await sb.rpc("submit_exam", { p_exam_id: cur.exam.id, p_answers: cur.answers }); } catch (e) { res = { error: e }; }

        if (res.error) {
          const msg = errText(res.error, SUBMIT_ERRORS, "ماقدرناش نسلّم الامتحان، جرّب تاني.");
          const terminal = Object.keys(SUBMIT_ERRORS).some((k) => (res.error.message || "").indexOf(k) !== -1);
          if (terminal) {
            closeExamScreen();
            try { localStorage.removeItem(draftKey()); } catch (e) {}
            toast(msg, true);
            loadExams();
          } else {
            cur.submitting = false;
            $("exSubmit").disabled = false;
            $("exSubmit").textContent = "تسليم الامتحان";
            toast(msg, true);
          }
          return;
        }

        try { localStorage.removeItem(draftKey()); } catch (e) {}
        closeExamScreen();
        const r = res.data || {};
        await loadExams();
        openModal((box) => {
          box.appendChild(h("h2", null, auto ? "الوقت خلص وتم التسليم" : "تم تسليم الامتحان"));
          box.appendChild(h("p", "sub", cur.exam.subject));
          box.appendChild(h("div", "result-score", ar(r.score) + " / " + ar(r.total)));
          box.appendChild(h("div", "result-note " + (r.passed ? "ok" : "no"),
            r.passed ? "ناجح" : "لم تنجح (المطلوب " + ar(r.pass_percent) + "٪)"));
          const actions = h("div", "actions");
          const ok = h("button", "btn-primary", "تمام");
          ok.type = "button";
          ok.addEventListener("click", closeModal);
          actions.appendChild(ok);
          box.appendChild(actions);
        });
      }

      $("exSubmit").addEventListener("click", () => {
        if (!cur.questions.length) { closeExamScreen(); loadExams(); return; }
        const left = cur.questions.filter((q) => cur.answers[q.id] == null).length;
        openModal((box) => {
          box.appendChild(h("h2", null, "تسليم الامتحان؟"));
          box.appendChild(h("p", "sub", left > 0
            ? "لسه فيه " + ar(left) + " سؤال من غير إجابة."
            : "جاوبت على كل الأسئلة."));
          const actions = h("div", "actions");
          const yes = h("button", "btn-primary", "سلّم");
          yes.type = "button";
          yes.addEventListener("click", () => { closeModal(); submitExam(false); });
          const no = h("button", "btn-ghost", "كمّل");
          no.type = "button";
          no.addEventListener("click", closeModal);
          actions.appendChild(yes);
          actions.appendChild(no);
          box.appendChild(actions);
        });
      });

      /* ============ الأوائل ============ */
      const CROWN = '<svg class="crown" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5L3 8z"/></svg>';
      const shortName = (n) => (n || "طالب").trim().split(/\s+/).slice(0, 2).join(" ");

      function podiumSlot(row, cls) {
        const d = h("div", "pod " + cls + (row ? "" : " ghost"));
        if (!row) { d.appendChild(h("div", "pod-block")); return d; }
        if (cls === "p1") { const c = h("span"); c.innerHTML = CROWN; d.appendChild(c.firstChild); }
        d.appendChild(avatarEl(row.avatar_url, row.full_name));
        d.appendChild(h("div", "pod-name", shortName(row.full_name)));
        d.appendChild(h("div", "pod-pts", ar(row.points) + " نقطة"));
        d.appendChild(h("div", "pod-block", ar(row.place)));
        return d;
      }

      function lbRow(row) {
        const r = h("div", "lb-row" + (row.user_id === me.id ? " me" : ""));
        r.appendChild(h("span", "lb-rank", "#" + ar(row.place)));
        r.appendChild(avatarEl(row.avatar_url, row.full_name));
        r.appendChild(h("span", "lb-name", row.full_name || "طالب"));
        const pts = h("span", "lb-pts", ar(row.points));
        pts.appendChild(h("small", null, "نقطة"));
        r.appendChild(pts);
        return r;
      }

      function renderLeaders(rows) {
        const body = $("lbBody");
        body.innerHTML = "";
        $("lbUpdated").textContent = "آخر تحديث للقائمة: " + fStamp.format(new Date(now()));

        if (!rows.length) {
          const empty = h("div", "empty");
          empty.style.marginTop = "16px";
          empty.appendChild(h("p", null, "لسه محدش خلّص امتحان ونجح. الترتيب هيظهر هنا بعد أول امتحان."));
          body.appendChild(empty);
          return;
        }

        const meta = h("div", "lb-meta");
        meta.appendChild(h("span", "chip", "أفضل ٢٠"));
        meta.appendChild(h("span", "chip", ar(rows.length) + " طالب في الترتيب"));
        body.appendChild(meta);

        const top = rows.slice(0, 20);
        const podium = h("div", "podium");
        podium.appendChild(podiumSlot(top[1] || null, "p2"));
        podium.appendChild(podiumSlot(top[0] || null, "p1"));
        podium.appendChild(podiumSlot(top[2] || null, "p3"));
        body.appendChild(podium);

        const list = h("div", "lb-list");
        top.slice(3).forEach((row) => list.appendChild(lbRow(row)));
        body.appendChild(list);

        const mine = rows.find((r) => r.user_id === me.id);
        if (mine && mine.place > 20) {
          body.appendChild(h("div", "lb-sep", "• • •"));
          const l2 = h("div", "lb-list");
          l2.appendChild(lbRow(mine));
          body.appendChild(l2);
        }
      }

      async function loadLeaders() {
        $("perMonth").setAttribute("aria-pressed", state.period === "month" ? "true" : "false");
        $("perAll").setAttribute("aria-pressed", state.period === "all" ? "true" : "false");
        let rows = [];
        try {
          const r = await sb.rpc("get_leaderboard", { p_period: state.period });
          if (!r.error && r.data) rows = r.data.map((x) => ({
            place: Number(x.place), user_id: x.user_id, full_name: x.full_name,
            avatar_url: x.avatar_url, points: Number(x.points)
          }));
        } catch (e) {}
        renderLeaders(rows);
      }
      $("perMonth").addEventListener("click", () => { state.period = "month"; loadLeaders(); });
      $("perAll").addEventListener("click", () => { state.period = "all"; loadLeaders(); });

      /* ============ الإعدادات ============ */
      function paintAccount() {
        const a1 = $("setAvatar"), a2 = $("accAvatar");
        a1.innerHTML = ""; a2.innerHTML = "";
        a1.appendChild(avatarEl(me.avatar, me.fullName, "lg"));
        a2.appendChild(avatarEl(me.avatar, me.fullName));
        $("setName").textContent = me.fullName || "حسابك";
        $("accName").textContent = me.fullName || "حسابك";
      }

      function paintSwatches() {
        const box = $("swatches");
        box.innerHTML = "";
        const current = window.QB.currentAccent().id;
        const dark = window.QB.isDark();
        window.QB.ACCENTS.forEach((a) => {
          const b = h("button", "swatch");
          b.type = "button";
          b.title = a.name;
          b.setAttribute("aria-label", a.name);
          b.style.background = dark ? a.dark : a.light;
          b.setAttribute("aria-pressed", a.id === current ? "true" : "false");
          b.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';
          b.addEventListener("click", () => {
            try { localStorage.setItem("qb-accent", a.id); } catch (e) {}
            window.QB.applyAccent();
            paintSwatches();
          });
          box.appendChild(b);
        });
      }

      let phoneLoaded = false;
      async function loadPhone() {
        if (phoneLoaded) return;
        try {
          const r = await sb.from("profile_private").select("phone").eq("user_id", me.id).maybeSingle();
          if (!r.error) {
            phoneLoaded = true;
            if (r.data && r.data.phone) $("phone").value = r.data.phone;
          }
        } catch (e) {}
      }

      function renderSettings() {
        paintAccount();
        paintSwatches();
        paintTheme();
        loadPhone();
      }

      const phoneMsg = $("phoneMsg");
      $("phoneSave").addEventListener("click", async () => {
        const raw = $("phone").value.replace(/[\s-]/g, "").replace(/[٠-٩]/g, (d) => AR_DIGITS.indexOf(d));
        if (raw && !/^01[0125][0-9]{8}$/.test(raw)) {
          phoneMsg.className = "field-msg err";
          phoneMsg.textContent = "اكتب رقم موبايل مصري صحيح من ١١ رقم، يبدأ بـ ٠١.";
          return;
        }
        const btn = $("phoneSave");
        btn.disabled = true;
        phoneMsg.className = "field-msg";
        phoneMsg.textContent = "";
        let res = null;
        try {
          res = await sb.from("profile_private").upsert({
            user_id: me.id, phone: raw || null, updated_at: new Date().toISOString()
          });
        } catch (e) { res = { error: e }; }
        btn.disabled = false;
        if (res.error) {
          phoneMsg.className = "field-msg err";
          phoneMsg.textContent = "ماقدرناش نحفظ الرقم، جرّب تاني.";
          return;
        }
        $("phone").value = raw;
        toast(raw ? "اتحفظ رقم التليفون" : "اتمسح رقم التليفون");
      });

      async function resizeToBlob(file, size) {
        let bmp = null;
        try { bmp = await createImageBitmap(file, { imageOrientation: "from-image" }); }
        catch (e) { bmp = await createImageBitmap(file); }
        const s = Math.min(bmp.width, bmp.height);
        const c = document.createElement("canvas");
        c.width = c.height = size;
        c.getContext("2d").drawImage(bmp, (bmp.width - s) / 2, (bmp.height - s) / 2, s, s, 0, 0, size, size);
        return await new Promise((resolve) => c.toBlob(resolve, "image/jpeg", 0.85));
      }

      $("avatarBtn").addEventListener("click", () => $("avatarFile").click());
      $("avatarFile").addEventListener("change", async (e) => {
        const file = e.target.files && e.target.files[0];
        e.target.value = "";
        if (!file) return;
        if (!/^image\//.test(file.type)) { toast("اختار صورة من فضلك.", true); return; }

        const btn = $("avatarBtn");
        btn.disabled = true;
        btn.textContent = "بنرفع الصورة...";
        try {
          const blob = await resizeToBlob(file, 256);
          if (!blob) throw new Error("resize");
          const path = me.id + "/avatar.jpg";
          const up = await sb.storage.from("avatars").upload(path, blob, { upsert: true, contentType: "image/jpeg", cacheControl: "3600" });
          if (up.error) throw up.error;
          const url = sb.storage.from("avatars").getPublicUrl(path).data.publicUrl + "?v=" + Date.now();
          const upd = await sb.from("profiles").update({ avatar_url: url }).eq("id", me.id);
          if (upd.error) throw upd.error;
          me.avatar = url;
          paintAccount();
          toast("اتغيّرت الصورة");
        } catch (err) {
          toast("ماقدرناش نغيّر الصورة، جرّب تاني.", true);
        }
        btn.disabled = false;
        btn.textContent = "تغيير الصورة";
      });

      $("logoutBtn").addEventListener("click", async () => {
        try { await sb.auth.signOut(); } catch (e) {}
        goLogin();
      });

      /* ============ تشغيل الصفحة ============ */
      function showApp() {
        $("bootView").hidden = true;
        $("appView").hidden = false;
        $("greet").textContent = me.fullName ? "أهلاً يا " + me.fullName : "أهلاً بيك";

        // نظّف الرابط من بيانات الدخول بعد الرجوع من جوجل
        const hash = window.location.hash.replace("#", "");
        const fromGoogle = window.location.hash.indexOf("access_token") !== -1 || window.location.search.indexOf("code=") !== -1;
        go(pages[hash] && !fromGoogle ? hash : "home", true);
      }

      (async function init() {
        let session = null;
        try {
          const r = await sb.auth.getSession();
          session = r.data && r.data.session;
        } catch (e) {}
        if (!session) { goLogin(); return; }

        // بنجيب بيانات الطالب من Supabase قبل ما ندخّله
        let user = null, err = null;
        try {
          const ur = await sb.auth.getUser();
          user = ur.data && ur.data.user;
          err = ur.error;
        } catch (e) {}

        if (!user) {
          const expired = err && (err.status === 401 || err.status === 403 || err.name === "AuthSessionMissingError");
          if (expired) {
            try { await sb.auth.signOut(); } catch (e) {}
            goLogin();
            return;
          }
          user = session.user; // مفيش نت: نكمل بالبيانات المحفوظة
        }

        me.user = user;
        await Promise.all([loadProfile(), syncClock()]);
        showApp();
      })();

      sb.auth.onAuthStateChange((evt) => {
        if (evt === "SIGNED_OUT") goLogin();
      });
    })();
  </script>
</body>
</html>
