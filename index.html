<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تسجيل الدخول | بنك الأسئلة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">

  <style>
    :root {
      --bg: #f6f8fa;
      --surface: #ffffff;
      --surface-2: #f6f8fa;
      --fg: #1f2328;
      --muted: #59636e;
      --border: #d1d9e0;
      --accent: #0969da;
      --accent-fg: #ffffff;
      --danger: #cf222e;
      --font-body: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0d1117; --surface: #151b23; --surface-2: #0d1117;
        --fg: #e6edf3; --muted: #9198a1; --border: #3d444d;
        --accent: #4493f8; --accent-fg: #0d1117; --danger: #f85149;
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg: #0d1117; --surface: #151b23; --surface-2: #0d1117;
      --fg: #e6edf3; --muted: #9198a1; --border: #3d444d;
      --accent: #4493f8; --accent-fg: #0d1117; --danger: #f85149;
      color-scheme: dark;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--fg);
      font-family: var(--font-body); font-size: 16px; line-height: 1.7;
    }
    [hidden] { display: none !important; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .page { min-height: 100vh; display: grid; place-items: center; padding: 32px 16px; }

    /* شاشة التحميل */
    .loading { display: grid; justify-items: center; gap: 16px; color: var(--muted); font-size: 15px; }
    .loading p { margin: 0; }
    .loader {
      width: 34px; height: 34px; border-radius: 50%;
      border: 3px solid var(--border); border-top-color: var(--accent);
      animation: spin .8s linear infinite;
    }

    .login-card {
      width: 100%; max-width: 400px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      padding: 28px 24px; display: flex; flex-direction: column; gap: 22px;
    }
    .card-head { display: flex; align-items: center; gap: 10px; }
    .card-head h1 { margin: 0; font-size: 21px; line-height: 1.4; }
    .card-sub { margin: 6px 0 0; color: var(--muted); font-size: 15px; }

    /* أيقونة الكتاب: من غير خلفية */
    .mini-brand { display: flex; align-items: center; justify-content: center; flex: none; color: var(--accent); }
    .mini-brand svg { width: 38px; height: 38px; display: block; }

    .google-btn {
      width: 100%; display: flex; align-items: center; justify-content: center; gap: 12px;
      padding: 12px 16px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--surface-2); color: var(--fg);
      font: inherit; font-weight: 600; font-size: 16px; cursor: pointer;
    }
    .google-btn:hover { border-color: var(--accent); }
    .google-btn[disabled] { cursor: progress; opacity: .75; }
    .google-btn svg { flex: none; }
    .spinner {
      display: none; width: 18px; height: 18px; border-radius: 50%;
      border: 2px solid var(--border); border-top-color: var(--accent);
      animation: spin .7s linear infinite;
    }
    .google-btn[aria-busy="true"] .spinner { display: block; }
    .google-btn[aria-busy="true"] .g-logo { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .remember {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px;
      background: var(--surface-2); cursor: pointer; user-select: none; font-size: 15px;
    }
    .remember:hover { border-color: var(--muted); }
    .remember small { display: block; color: var(--muted); font-size: 13px; line-height: 1.5; }
    .remember input { position: absolute; opacity: 0; width: 0; height: 0; }
    .switch {
      position: relative; width: 42px; height: 24px; border-radius: 999px;
      background: var(--border); flex: none; transition: background-color .2s ease;
    }
    .switch::after {
      content: ""; position: absolute; top: 3px; inset-inline-start: 3px;
      width: 18px; height: 18px; border-radius: 50%; background: var(--surface);
      transition: inset-inline-start .2s ease;
    }
    .remember input:checked + .switch { background: var(--accent); }
    .remember input:checked + .switch::after { inset-inline-start: 21px; background: var(--accent-fg); }
    .remember input:focus-visible + .switch { outline: 2px solid var(--accent); outline-offset: 2px; }

    .status { min-height: 1.7em; font-size: 14px; text-align: center; color: var(--muted); }
    .status.error { color: var(--danger); }

    @media (prefers-reduced-motion: reduce) { .spinner, .loader { animation-duration: 2s; } }
  </style>

  <script>
    // الوضع الفاتح / الداكن (بيتطبق بدري عشان مفيش وميض)
    (function () {
      try {
        var saved = localStorage.getItem("qb-theme");
        if (saved === "dark" || saved === "light") document.documentElement.setAttribute("data-theme", saved);
      } catch (e) {}
    })();
  </script>
</head>
<body>

  <!-- شاشة التحميل: بتظهر لحد ما نتأكد لو فيه جلسة شغالة -->
  <div class="page" id="loadingView">
    <div class="loading">
      <div class="loader" aria-hidden="true"></div>
      <p>ثانية واحدة...</p>
    </div>
  </div>

  <!-- صفحة تسجيل الدخول (لوحدها، من غير شريط علوي) -->
  <div class="page" id="loginView" hidden>
    <main class="login-card">
      <div>
        <div class="card-head">
          <div class="mini-brand" role="img" aria-label="بنك الأسئلة">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M4 21.5V5.5"/><path d="M9 8.5h7M9 12h5"/></svg>
          </div>
          <h1>أهلاً بيك في بنك الأسئلة</h1>
        </div>
        <p class="card-sub">سجّل دخولك عشان تدخل بنك الأسئلة والكويزات.</p>
      </div>

      <label class="remember" for="remember">
        <span>تذكرني<small>ماتسجلش دخول تاني على الجهاز ده</small></span>
        <input type="checkbox" id="remember" checked>
        <span class="switch" aria-hidden="true"></span>
      </label>

      <button class="google-btn" id="googleBtn" type="button">
        <svg class="g-logo" width="20" height="20" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        <span class="spinner" aria-hidden="true"></span>
        <span id="btnLabel">سجّل بحساب Google</span>
      </button>

      <div class="status" id="status" role="status" aria-live="polite"></div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script>
    var SUPABASE_URL = "https://gcumvhqxcbgtedqnuzvr.supabase.co";
    var SUPABASE_ANON_KEY = "sb_publishable_p95Q2a4chqmwS10ht5edMg_LfTqWQwA";

    // اسم صفحة الرئيسية (الملف التاني)
    var HOME_PAGE = "home.html";

    (function () {
      var loadingView = document.getElementById("loadingView");
      var loginView = document.getElementById("loginView");
      var btn = document.getElementById("googleBtn");
      var label = document.getElementById("btnLabel");
      var statusEl = document.getElementById("status");
      var rememberBox = document.getElementById("remember");
      try { rememberBox.checked = localStorage.getItem("qb-remember") !== "0"; } catch (e) {}

      function remembered() {
        try { return localStorage.getItem("qb-remember") !== "0"; } catch (e) { return true; }
      }
      // "تذكرني" مفعّل: الجلسة على الجهاز. غير كده: بتتقفل مع التبويب
      var authStorage = {
        getItem: function (k) { try { return localStorage.getItem(k) || sessionStorage.getItem(k); } catch (e) { return null; } },
        setItem: function (k, v) {
          try {
            var keep = remembered();
            (keep ? localStorage : sessionStorage).setItem(k, v);
            (keep ? sessionStorage : localStorage).removeItem(k);
          } catch (e) {}
        },
        removeItem: function (k) { try { localStorage.removeItem(k); sessionStorage.removeItem(k); } catch (e) {} }
      };
      var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { storage: authStorage } });

      function homeUrl() { return new URL(HOME_PAGE, window.location.href).href; }
      function goHome() { window.location.replace(homeUrl()); }

      function setStatus(msg, isError) {
        statusEl.textContent = msg || "";
        statusEl.className = "status" + (isError ? " error" : "");
      }
      function resetButton() {
        btn.disabled = false;
        btn.removeAttribute("aria-busy");
        label.textContent = "سجّل بحساب Google";
      }
      function showLogin() {
        loadingView.hidden = true;
        loginView.hidden = false;
        resetButton();
      }

      btn.addEventListener("click", async function () {
        if (btn.disabled) return;
        btn.disabled = true;
        btn.setAttribute("aria-busy", "true");
        label.textContent = "ثانية واحدة...";
        setStatus("");
        try { localStorage.setItem("qb-remember", rememberBox.checked ? "1" : "0"); } catch (e) {}

        var result = await sb.auth.signInWithOAuth({
          provider: "google",
          options: {
            // بعد جوجل يرجع على طول للصفحة الرئيسية
            redirectTo: homeUrl(),
            // بيخلي جوجل يعرض شاشة اختيار الحساب كل مرة
            queryParams: { prompt: "select_account" }
          }
        });

        if (result.error) {
          resetButton();
          setStatus("ماقدرناش نفتح تسجيل الدخول، جرّب تاني.", true);
        }
      });

      // لو رجعت من صفحة جوجل بزرار الرجوع، الزرار يرجع طبيعي
      window.addEventListener("pageshow", function (e) { if (e.persisted) resetButton(); });

      // لو فيه جلسة شغالة، ادخل الرئيسية على طول
      sb.auth.getSession().then(function (res) {
        if (res.data && res.data.session) goHome();
        else showLogin();
      }).catch(showLogin);
    })();
  </script>
</body>
</html>
