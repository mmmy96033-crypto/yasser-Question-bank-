  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">

  <style>
    :root {
      --bg: #f6f8fa; --surface: #ffffff; --surface-2: #f6f8fa;
      --fg: #1f2328; --muted: #59636e; --border: #d1d9e0;
      --accent: #0969da; --accent-fg: #ffffff;
      --danger: #cf222e; --ok: #1a7f37;
      --shadow: rgba(31, 35, 40, .10);
      --font-body: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
      --maxw: 720px;
      --topbar-h: 64px;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0d1117; --surface: #151b23; --surface-2: #0d1117;
        --fg: #e6edf3; --muted: #9198a1; --border: #3d444d;
        --accent: #4493f8; --accent-fg: #0d1117;
        --danger: #f85149; --ok: #3fb950;
        --shadow: rgba(0, 0, 0, .45);
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg: #0d1117; --surface: #151b23; --surface-2: #0d1117;
      --fg: #e6edf3; --muted: #9198a1; --border: #3d444d;
      --accent: #4493f8; --accent-fg: #0d1117;
      --danger: #f85149; --ok: #3fb950;
      --shadow: rgba(0, 0, 0, .45);
      color-scheme: dark;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { overflow-x: hidden; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    html, body { min-height: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--fg);
      font-family: var(--font-body); font-size: 16px; line-height: 1.7;
      overflow-x: clip; max-width: 100%;
    }
    [hidden] { display: none !important; }
    button { font: inherit; color: inherit; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* ---------- تحميل ---------- */
    .boot { min-height: 100vh; display: grid; place-items: center; padding: 32px 16px; }
    .loading { display: grid; justify-items: center; gap: 16px; color: var(--muted); font-size: 15px; text-align: center; }
    .loading p { margin: 0; }
    .loading strong { color: var(--fg); font-weight: 600; display: block; margin-bottom: 4px; font-size: 16px; }
    .loader {
      width: 34px; height: 34px; border-radius: 50%;
      border: 3px solid var(--border); border-top-color: var(--accent);
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---------- الشريط العلوي (ثابت) ---------- */
    .topbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 40;
      padding-top: env(safe-area-inset-top, 0px);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      border-radius: 0 0 24px 24px;
      box-shadow: 0 8px 20px var(--shadow);
    }
    .topbar-in {
      position: relative; max-width: var(--maxw); margin: 0 auto;
      height: var(--topbar-h); padding-inline: 16px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; min-width: 0; }
    .brand svg { width: 28px; height: 28px; color: var(--accent); flex: none; }
    .brand span { font-size: 18px; white-space: nowrap; }
    .top-actions { display: flex; align-items: center; gap: 4px; flex: none; }

    .icon-btn {
      position: relative; display: inline-flex; align-items: center; justify-content: center;
      width: 42px; height: 42px; border-radius: 12px;
      border: 1px solid transparent; background: transparent; color: var(--fg); cursor: pointer;
    }
    .icon-btn:hover, .icon-btn[aria-expanded="true"] { background: var(--surface-2); border-color: var(--border); }
    .icon-btn svg { width: 22px; height: 22px; }

    .badge {
      position: absolute; top: 1px; right: 1px;
      min-width: 18px; height: 18px; padding: 0 5px;
      border-radius: 999px; background: var(--danger); color: #fff;
      font-size: 11px; font-weight: 600; line-height: 18px; text-align: center;
      border: 2px solid var(--surface); box-sizing: content-box;
    }

    /* ---------- الإشعارات ---------- */
    .notif-panel {
      position: absolute; top: calc(100% + 8px); left: 12px;
      width: min(360px, calc(100vw - 24px));
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; box-shadow: 0 12px 32px var(--shadow);
      overflow: hidden; z-index: 5;
    }
    .notif-head { padding: 12px 16px; border-bottom: 1px solid var(--border); font-weight: 600; font-size: 15px; }
    .notif-list { list-style: none; margin: 0; padding: 0; max-height: min(55vh, 380px); overflow: auto; }
    .notif-item { display: flex; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
    .notif-item:last-child { border-bottom: none; }
    .notif-item.pin { background: color-mix(in srgb, var(--ok) 8%, var(--surface)); }
    .notif-item.pin .notif-title { color: var(--ok); }
    .notif-dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: transparent; margin-top: 10px; }
    .notif-item.new .notif-dot { background: var(--accent); }
    .notif-body { flex: 1; min-width: 0; }
    .notif-title { font-size: 14.5px; font-weight: 600; overflow-wrap: anywhere; }
    .notif-text { font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
    .notif-time { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
    .notif-empty { padding: 26px 16px; text-align: center; color: var(--muted); font-size: 14.5px; }
    .notif-more {
      display: block; width: 100%; padding: 11px; border: none; border-top: 1px solid var(--border);
      background: var(--surface-2); color: var(--accent); font-size: 14px; font-weight: 600; cursor: pointer;
    }
    .notif-more:hover { filter: brightness(.97); }

    /* ---------- المحتوى ---------- */
    .main {
      max-width: var(--maxw); margin: 0 auto;
      padding: calc(var(--topbar-h) + env(safe-area-inset-top, 0px) + 22px) 16px calc(100px + env(safe-area-inset-bottom, 0px));
    }
    .main > section { min-width: 0; }
    .greet { margin: 0 0 18px; font-size: 20px; line-height: 1.5; overflow-wrap: anywhere; }
    .page-title { display: flex; align-items: center; gap: 10px; margin: 0 0 16px; font-size: 20px; }
    .page-title svg { width: 24px; height: 24px; color: var(--accent); flex: none; }
    .narrow { max-width: 680px; margin-inline: auto; }

    .empty {
      border: 1px dashed var(--border); border-radius: 14px; background: var(--surface);
      padding: 36px 18px; text-align: center; color: var(--muted); font-size: 15px;
    }
    .empty p { margin: 0; }

    /* ---------- الأزرار ---------- */
    .btn-primary, .btn-ghost, .btn-danger {
      border-radius: 10px; padding: 11px 18px; font-weight: 600; font-size: 15px; cursor: pointer;
      border: 1px solid transparent; max-width: 100%;
    }
    .btn-primary { background: var(--accent); color: var(--accent-fg); }
    .btn-primary:hover { filter: brightness(1.08); }
    .btn-ghost { background: var(--surface-2); border-color: var(--border); color: var(--fg); }
    .btn-ghost:hover { border-color: var(--muted); }
    .btn-danger { background: transparent; border-color: var(--danger); color: var(--danger); }
    .btn-danger:hover { background: var(--danger); color: #fff; }
    button[disabled] { opacity: .55; cursor: not-allowed; }

    /* ---------- كروت الامتحانات ---------- */
    .exam-list { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); }
    .exam {
      width: 100%; min-width: 0; text-align: start; cursor: pointer;
      background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
      padding: 16px; display: flex; flex-direction: column; gap: 12px;
      box-shadow: 0 2px 8px var(--shadow);
    }
    .exam:hover { border-color: var(--accent); }
    .exam-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .exam-title { font-weight: 600; font-size: 18px; overflow-wrap: anywhere; min-width: 0; }
    .chip {
      flex: none; font-size: 12.5px; font-weight: 600; padding: 2px 10px; border-radius: 999px;
      border: 1px solid var(--border); color: var(--muted); background: var(--surface-2);
    }
    .chip.open { color: var(--ok); border-color: var(--ok); }
    .chip.done { color: var(--accent); border-color: var(--accent); }
    .info { display: grid; gap: 4px; }
    .row { display: flex; gap: 6px; flex-wrap: wrap; font-size: 14.5px; }
    .row .k { color: var(--muted); }
    .row .v { font-weight: 500; overflow-wrap: anywhere; min-width: 0; }
    .exam-line {
      border-top: 1px solid var(--border); padding-top: 10px;
      font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums;
    }

    /* ---------- نافذة في نص الشاشة ---------- */
    .modal-back {
      position: fixed; inset: 0; z-index: 80; background: rgba(0, 0, 0, .55);
      display: grid; place-items: center; padding: 16px; overflow: auto;
    }
    .modal {
      width: min(420px, 100%); max-height: 92vh; overflow: auto;
      background: var(--surface); border: 1px solid var(--border); border-radius: 20px;
      padding: 22px 20px; display: grid; gap: 14px; box-shadow: 0 16px 40px var(--shadow);
      grid-template-columns: minmax(0, 1fr);
    }
    .modal h2 { margin: 0; font-size: 20px; text-align: center; }
    .modal .sub { margin: 0; text-align: center; color: var(--muted); font-size: 15px; }
    .modal .actions { display: grid; gap: 8px; margin-top: 4px; }
    .result-score { text-align: center; font-size: 34px; font-weight: 600; line-height: 1.3; }
    .result-note { text-align: center; font-weight: 600; }
    .result-note.ok { color: var(--ok); }
    .result-note.no { color: var(--danger); }

    /* عدّادات النتيجة */
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .stat { text-align: center; padding: 10px 4px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface-2); }
    .stat strong { display: block; font-size: 24px; line-height: 1.3; }
    .stat span { font-size: 13px; color: var(--muted); }
    .stat.ok strong { color: var(--ok); }
    .stat.no strong { color: var(--danger); }

    /* قايمة الصورة */
    .menu { display: grid; gap: 8px; }
    .menu-item {
      display: flex; align-items: center; gap: 12px; width: 100%; padding: 13px 14px;
      border-radius: 12px; border: 1px solid var(--border); background: var(--surface-2);
      cursor: pointer; font-weight: 500; text-align: start;
    }
    .menu-item:hover:not([disabled]) { border-color: var(--accent); }
    .menu-item svg { width: 20px; height: 20px; flex: none; color: var(--accent); }
    .menu-item.danger, .menu-item.danger svg { color: var(--danger); }
    .menu-item[disabled] { opacity: .45; }
    .presets { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .preset {
      display: grid; justify-items: center; gap: 8px; padding: 14px 8px; cursor: pointer;
      border: 2px solid var(--border); border-radius: 16px; background: var(--surface-2); font-weight: 600;
    }
    .preset:hover { border-color: var(--muted); }
    .preset[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--surface)); }
    .viewer { display: grid; justify-items: center; gap: 12px; }
    .viewer .profile-name { text-align: center; }

    /* ---------- شاشة الامتحان ---------- */
    .exam-screen { position: fixed; inset: 0; z-index: 70; background: var(--bg); display: flex; flex-direction: column; }
    .exam-top {
      padding: env(safe-area-inset-top, 0px) 16px 0;
      background: var(--surface); border-bottom: 1px solid var(--border);
      border-radius: 0 0 20px 20px; box-shadow: 0 6px 16px var(--shadow);
    }
    .exam-top-in {
      max-width: 720px; margin: 0 auto; padding-block: 12px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .exam-top strong { display: block; font-size: 17px; overflow-wrap: anywhere; }
    .exam-top small { color: var(--muted); font-size: 13px; }
    .exam-top-in > div:first-child { min-width: 0; }
    .exam-body { flex: 1; overflow: auto; padding: 16px; }
    .exam-body-in { display: grid; gap: 14px; align-content: start; max-width: 720px; width: 100%; margin: 0 auto; grid-template-columns: minmax(0, 1fr); }
    .q { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px; display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
    .q-body { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
    .opts { display: grid; gap: 8px; }
    .opt {
      text-align: start; cursor: pointer; display: flex; align-items: center; gap: 10px;
      padding: 11px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-2);
      overflow-wrap: anywhere;
    }
    .opt .dot { flex: none; width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--border); }
    .opt[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--surface)); }
    .opt[aria-pressed="true"] .dot { border-color: var(--accent); background: radial-gradient(circle, var(--accent) 45%, transparent 50%); }
    .opt:disabled { cursor: default; opacity: 1; }
    .opt.right { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, var(--surface)); }
    .opt.right .dot { border-color: var(--ok); background: radial-gradient(circle, var(--ok) 45%, transparent 50%); }
    .opt.wrong { border-color: var(--danger); background: color-mix(in srgb, var(--danger) 14%, var(--surface)); }
    .opt.wrong .dot { border-color: var(--danger); background: radial-gradient(circle, var(--danger) 45%, transparent 50%); }
    .exam-foot {
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
      background: var(--surface); border-top: 1px solid var(--border);
      border-radius: 20px 20px 0 0; box-shadow: 0 -6px 16px var(--shadow);
    }
    .exam-foot .btn-primary { width: 100%; max-width: 720px; display: block; margin: 0 auto; }

    /* دايرة العدّ التنازلي (١٠ ثواني) */
    .ring { position: relative; width: 120px; height: 120px; margin: 4px auto 0; }
    .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .ring circle { fill: none; stroke-width: 8; }
    .ring .bg { stroke: var(--border); }
    .ring .fg { stroke: var(--accent); stroke-linecap: round; }
    .ring.low .fg { stroke: var(--danger); }
    .ring span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .ring.low span { color: var(--danger); }
    .qtype { justify-self: center; }
    .fb { border-radius: 12px; padding: 12px 14px; border: 1px solid var(--border); display: grid; gap: 4px; font-size: 15px; }
    .fb.right { border-color: var(--ok); } .fb.right strong { color: var(--ok); }
    .fb.wrong { border-color: var(--danger); } .fb.wrong strong { color: var(--danger); }
    .fb.skip { border-color: var(--muted); }
    .fb-ex { color: var(--muted); }

    /* ---------- الأوائل ---------- */
    .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; }
    .seg button { border: none; background: transparent; padding: 9px; border-radius: 9px; font-weight: 600; font-size: 14.5px; cursor: pointer; color: var(--muted); }
    .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
    .lb-meta { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 4px; }
    .chip.total { margin-inline-start: auto; color: var(--accent); border-color: var(--accent); }
    .chip.mine { color: var(--fg); font-size: 13.5px; }
    .lb-updated { color: var(--muted); font-size: 13px; margin: 6px 0 0; }

    .podium { display: flex; align-items: flex-end; justify-content: center; gap: 10px; margin: 26px 0 22px; }
    .pod { flex: 1; max-width: 160px; display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
    .pod.ghost { visibility: hidden; }
    .pod .avatar { --av: 64px; border-width: 3px; }
    .pod.p1 .avatar { --av: 84px; border-color: #d4af37; box-shadow: 0 0 0 4px rgba(212, 175, 55, .18); }
    .pod.p2 .avatar { border-color: #aab2bd; }
    .pod.p3 .avatar { border-color: #cd7f32; }
    .crown { width: 26px; height: 26px; color: #d4af37; margin-bottom: -2px; }
    .pod-name { font-size: 14px; font-weight: 600; text-align: center; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pod-pts { font-size: 12.5px; color: var(--muted); }
    .pod-block {
      width: 100%; border-radius: 12px 12px 0 0; display: grid; place-items: center;
      font-weight: 700; font-size: 24px; color: #3b2a00;
    }
    .p1 .pod-block { height: 110px; background: linear-gradient(#ffe58a, #f1c84b); }
    .p2 .pod-block { height: 82px; background: linear-gradient(#f2f4f7, #cfd5dd); }
    .p3 .pod-block { height: 62px; background: linear-gradient(#f6c79a, #d9915a); }

    .lb-list { display: grid; gap: 8px; }
    .lb-row {
      display: flex; align-items: center; gap: 12px; padding: 10px 12px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    }
    .lb-row.me { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
    .lb-rank { width: 38px; flex: none; text-align: center; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
    .lb-name { flex: 1; min-width: 0; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lb-pts { flex: none; font-weight: 600; font-variant-numeric: tabular-nums; }
    .lb-pts small { color: var(--muted); font-weight: 500; margin-inline-start: 4px; }

    /* ---------- درجات الطالب ---------- */
    .g-hero {
      display: flex; align-items: center; gap: 14px; margin-bottom: 14px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 16px;
      box-shadow: 0 2px 8px var(--shadow);
    }
    .g-hero .avatar { --av: 64px; border-width: 2px; }
    .g-who { min-width: 0; }
    .g-name { font-weight: 600; font-size: 18px; overflow-wrap: anywhere; line-height: 1.5; }
    .g-mail { color: var(--muted); font-size: 13.5px; overflow-wrap: anywhere; direction: ltr; text-align: right; }
    .g-table {
      width: 100%; border-collapse: separate; border-spacing: 0; margin-top: 14px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 16px; overflow: hidden;
      box-shadow: 0 2px 8px var(--shadow);
    }
    .g-table th, .g-table td { padding: 12px 8px; text-align: center; border-bottom: 1px solid var(--border); font-size: 14.5px; }
    .g-table th { background: var(--surface-2); color: var(--muted); font-weight: 600; font-size: 13px; }
    .g-table th:first-child, .g-table td:first-child { text-align: start; padding-inline-start: 14px; font-weight: 500; }
    .g-table tr:last-child td { border-bottom: none; }
    .g-score { font-variant-numeric: tabular-nums; white-space: nowrap; }
    .g-grade {
      display: inline-block; min-width: 62px; padding: 2px 10px; border-radius: 999px;
      font-weight: 600; font-size: 13px; border: 1px solid var(--border); color: var(--muted);
    }
    .g-grade.a { color: var(--ok); border-color: var(--ok); }
    .g-grade.b { color: var(--accent); border-color: var(--accent); }
    .g-grade.c { color: #d29922; border-color: #d29922; }

    .switch {

    /* ---------- رسالة سريعة ---------- */

  <script>
    // الوضع الفاتح / الداكن ولون الأزرار (بيتطبقوا بدري عشان مفيش وميض)
    (function () {
      var ACCENTS = [
        { id: "blue",   name: "أزرق",    light: "#0969da", dark: "#4493f8" },
        { id: "green",  name: "أخضر",    light: "#1a7f37", dark: "#3fb950" },
        { id: "purple", name: "بنفسجي",  light: "#8250df", dark: "#a371f7" },
        { id: "orange", name: "برتقالي", light: "#bc4c00", dark: "#f0883e" },
        { id: "pink",   name: "وردي",    light: "#bf3989", dark: "#f778ba" },
        { id: "teal",   name: "تركواز",  light: "#0e7c86", dark: "#39c5cf" },
        { id: "red",    name: "أحمر",    light: "#cf222e", dark: "#ff7b72" }
      ];
      function isDark() {
        var t = document.documentElement.getAttribute("data-theme");
        if (t) return t === "dark";
        return !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
      }
      function currentAccent() {
        var id = "blue";
        try { id = localStorage.getItem("qb-accent") || "blue"; } catch (e) {}
        for (var i = 0; i < ACCENTS.length; i++) if (ACCENTS[i].id === id) return ACCENTS[i];
        return ACCENTS[0];
      }
      function applyAccent() {
        var a = currentAccent(), dark = isDark(), s = document.documentElement.style;
        s.setProperty("--accent", dark ? a.dark : a.light);
        s.setProperty("--accent-fg", dark ? "#0d1117" : "#ffffff");
      }
      window.QB = { ACCENTS: ACCENTS, isDark: isDark, applyAccent: applyAccent, currentAccent: currentAccent };
      try {
        var saved = localStorage.getItem("qb-theme");
        if (saved === "dark" || saved === "light") document.documentElement.setAttribute("data-theme", saved);
      } catch (e) {}
      applyAccent();
      if (window.matchMedia) {
        var mq = window.matchMedia("(prefers-color-scheme: dark)");
        var onChange = function () { applyAccent(); };
        if (mq.addEventListener) mq.addEventListener("change", onChange);
      }
    })();
  </script>

  function renderNotifs() {
    const list = $("notifList");
    list.innerHTML = "";
    const more = $("notifMore");
    if (!notif.items.length) {
      const li = h("li", "notif-empty", "مفيش إشعارات لحد دلوقتي.");
      list.appendChild(li);
      more.hidden = true;
      return;
    }
    const shown = notif.expanded ? notif.items : notif.items.slice(0, NOTIF_VISIBLE);
    shown.forEach((n) => {
      const isNew = new Date(n.created_at).getTime() > notif.seenBefore;
      const li = h("li", "notif-item" + (isNew ? " new" : "") + (n.pin ? " pin" : ""));
      li.appendChild(h("span", "notif-dot"));
      const body = h("div", "notif-body");
      body.appendChild(h("div", "notif-title", n.title));
      if (n.body) body.appendChild(h("div", "notif-text", n.body));
      body.appendChild(h("div", "notif-time", rel(n.created_at)));
      li.appendChild(body);
      list.appendChild(li);
    });
    if (notif.items.length > NOTIF_VISIBLE) {
      more.hidden = false;
      more.textContent = notif.expanded ? "عرض أقل" : "عرض المزيد";
    } else {
      more.hidden = true;
    }
  }
  async function loadNotifs() {
    try {
      const r = await sb.from("notifications").select("id, title, body, created_at").order("created_at", { ascending: false }).limit(30);
      if (!r.error && r.data) notif.server = r.data;
    } catch (e) {}
    mergeNotifs();
    updateBadge();
    if (notif.open) renderNotifs();
  }
  function markSeen() {
    notif.seenAt = now();
    try { localStorage.setItem(seenKey(), String(notif.seenAt)); } catch (e) {}
    updateBadge();
  }
  function openNotif() {
    notif.open = true;
    notif.expanded = false;
    notif.seenBefore = notif.seenAt;
    renderNotifs();
    $("notifPanel").hidden = false;
    $("bellBtn").setAttribute("aria-expanded", "true");
    markSeen();
    loadNotifs();
  }
  function closeNotif() {
    if (!notif.open) return;
    notif.open = false;
    $("notifPanel").hidden = true;
    $("bellBtn").setAttribute("aria-expanded", "false");
  }
  $("bellBtn").addEventListener("click", (e) => { e.stopPropagation(); notif.open ? closeNotif() : openNotif(); });
  $("notifMore").addEventListener("click", (e) => { e.stopPropagation(); notif.expanded = !notif.expanded; renderNotifs(); });
  document.addEventListener("click", (e) => {
    if (!notif.open) return;
    if (!$("notifPanel").contains(e.target) && !$("bellBtn").contains(e.target)) closeNotif();
  });

  /* ============ الرئيسية: الامتحانات ============ */
  function infoRows(exam) {
    const box = h("div", "info");
    const subjAt = new Date(exam.subject_at || exam.starts_at);
    const add = (k, v) => {
      const r = h("div", "row");
      r.appendChild(h("span", "k", k));
      r.appendChild(h("span", "v", v));
      box.appendChild(r);
    };
    add("اسم المادة:", exam.subject);
    add("تاريخ ووقت المادة:", fDate.format(subjAt) + " · " + fTime.format(subjAt));
    add("اسم الدكتور:", exam.doctor);
    add("بداية الامتحان الساعة:", fTime.format(new Date(exam.starts_at)));
    add("نهاية الامتحان الساعة:", fTime.format(new Date(exam.ends_at)));
    return box;
  }

  function examStatus(exam) {
    const t = now();
    const att = state.attempts[exam.id];
    if (att && att.submitted_at) return "done";
    if (t >= new Date(exam.ends_at).getTime()) return "ended";
    if (t < new Date(exam.starts_at).getTime()) return "soon";
    return "open";
  }

  function updateCard(ref) {
    const exam = ref.exam;
    const st = examStatus(exam);
    const t = now();
    ref.status = st;
    ref.chip.className = "chip" + (st === "open" ? " open" : st === "done" ? " done" : "");
    if (st === "done") {
      const a = state.attempts[exam.id];
      ref.chip.textContent = "تم التسليم";
      ref.line.textContent = "درجتك: " + arNum(a.score) + " من " + ar(a.total) + (a.passed ? " · ناجح" : " · لم تنجح");
    } else if (st === "soon") {
      ref.chip.textContent = "قريباً";
      ref.line.textContent = "يبدأ بعد " + ar(fmtLeft(new Date(exam.starts_at).getTime() - t));
    } else if (st === "open") {
      ref.chip.textContent = "متاح الآن";
      ref.line.textContent = "باقي على النهاية " + ar(fmtLeft(new Date(exam.ends_at).getTime() - t));
    }
  }

  function showEmpty() {
    const t = now();
    const missed = state.exams.some((e) => {
      const att = state.attempts[e.id];
      return new Date(e.ends_at).getTime() <= t && !(att && att.submitted_at);
    });
    $("examEmptyText").textContent = missed
      ? "تم انتهاء الامتحان، استنى الامتحان القادم."
      : "مفيش امتحانات دلوقتي.";
    $("examEmpty").hidden = false;
  }

  function renderExams() {
    const list = $("examList");
    list.innerHTML = "";
    state.cards = {};
    $("examEmpty").hidden = true;

    const shown = state.exams.filter((e) => new Date(e.ends_at).getTime() > now());
    if (!shown.length) { showEmpty(); return; }

    shown.forEach((exam) => {
      const card = h("button", "exam");
      card.type = "button";
      const head = h("div", "exam-head");
      head.appendChild(h("span", "exam-title", exam.subject));
      const chip = h("span", "chip");
      head.appendChild(chip);
      card.appendChild(head);
      card.appendChild(infoRows(exam));
      const line = h("div", "exam-line");
      card.appendChild(line);
      card.addEventListener("click", () => showExamModal(exam));
      list.appendChild(card);
      const ref = { exam, card, chip, line, status: "" };
      state.cards[exam.id] = ref;
      updateCard(ref);
    });
  }

  async function loadExams() {
    let exams = [];
    const attempts = {};
    try {
      const since = new Date(now() - 24 * 3600 * 1000).toISOString();
      const r = await sb.from("exams").select("*").gt("ends_at", since).order("starts_at", { ascending: true });
      if (!r.error && r.data) exams = r.data;
    } catch (e) {}
    try {
      const a = await sb.from("attempts").select("exam_id, submitted_at, score, total, passed").eq("user_id", me.id);
      if (!a.error && a.data) a.data.forEach((x) => { attempts[x.exam_id] = x; });
    } catch (e) {}
    state.exams = exams;
    state.attempts = attempts;
    renderExams();
  }

  // كل ثانية: نحدّث العدّاد، ولو الامتحان خلص من غير ما أدخله يتشال من الصفحة
  setInterval(() => {
    if (state.page !== "home") return;
    let removed = false;
    Object.keys(state.cards).forEach((id) => {
      const ref = state.cards[id];
      updateCard(ref);
      if (ref.status === "ended") {
        ref.card.remove();
        delete state.cards[id];
        removed = true;
      }
    });
    if (removed && !Object.keys(state.cards).length) showEmpty();
  }, 1000);

  document.addEventListener("visibilitychange", () => {
    if (document.hidden || !me.id) return;
    loadNotifs();
    if (state.page === "home" && $("examScreen").hidden) loadExams();
  });
  setInterval(() => { if (me.id && !document.hidden) loadNotifs(); }, 60000);

  const START_ERRORS = {
    exam_not_started: "الامتحان لسه ما بدأش.",
    exam_ended: "تم انتهاء الامتحان.",
    already_submitted: "أنت سلّمت الامتحان ده قبل كده.",
    exam_not_found: "الامتحان ده مش موجود."
  };
  function errText(err, map, fallback) {
    const msg = (err && err.message) || "";
    for (const k in map) if (msg.indexOf(k) !== -1) return map[k];
    return fallback;
  }

  function showExamModal(exam) {
    const st = examStatus(exam);
    if (st === "ended") { loadExams(); return; }
    const att = state.attempts[exam.id];

    openModal((box) => {
      if (st === "done") {
        box.appendChild(h("h2", null, "تم تسليم الامتحان"));
        box.appendChild(h("p", "sub", exam.subject));
        box.appendChild(h("div", "result-score", arNum(att.score) + " / " + ar(att.total)));
        box.appendChild(h("div", "result-note " + (att.passed ? "ok" : "no"), att.passed ? "ناجح" : "لم تنجح"));
        const actions = h("div", "actions");
        actions.appendChild(modalBtn("تمام", "btn-ghost", closeModal));
        box.appendChild(actions);
        return;
      }

      box.appendChild(h("h2", null, "ابدأ الامتحان"));
      box.appendChild(infoRows(exam));
      box.appendChild(h("p", "sub", "كل سؤال ليه ١٠ ثواني. لو الوقت خلص من غير إجابة هيتحسب بنص درجة."));

      const actions = h("div", "actions");
      const enter = h("button", "btn-primary", "ادخل");
      enter.type = "button";
      if (st === "soon") { enter.disabled = true; enter.textContent = "لسه ما بدأش"; }
      enter.addEventListener("click", async () => {
        enter.disabled = true;
        enter.textContent = "ثانية واحدة...";
        let res = null;
        try { res = await sb.rpc("start_exam", { p_exam_id: exam.id }); } catch (e) { res = { error: e }; }
        if (res.error) {
          toast(errText(res.error, START_ERRORS, "ماقدرناش نفتح الامتحان، جرّب تاني."), true);
          closeModal();
          loadExams();
          return;
        }
        // صور الأسئلة (من دالة get_question_images)
        try {
          const im = await sb.rpc("get_question_images", { p_exam_id: exam.id });
          if (!im.error && im.data && res.data && res.data.questions) {
            res.data.questions.forEach((q) => { if (im.data[q.id]) q.image_url = im.data[q.id]; });
          }
        } catch (e) {}
        closeModal();
        openExam(exam, res.data);
      });
      actions.appendChild(enter);
      actions.appendChild(modalBtn("إلغاء", "btn-ghost", closeModal));
      box.appendChild(actions);
    });
  }

  /* ============ شاشة الامتحان (سؤال بسؤال، ١٠ ثواني) ============ */
  const QSEC = 10, CIRC = 2 * Math.PI * 45;
  const cur = { exam: null, qs: [], i: 0, res: [], endsAt: 0, timer: null, locked: false, finishing: false, mode: "next", optEls: [] };

  function setFoot(label, disabled) {
    const b = $("exSubmit");
    b.textContent = label;
    b.disabled = !!disabled;
  }

  function openExam(exam, data) {
    cur.exam = exam;
    cur.qs = (data && data.questions) || [];
    cur.i = 0; cur.res = []; cur.finishing = false; cur.mode = "next";
    cur.endsAt = new Date((data && data.ends_at) || exam.ends_at).getTime();
    $("exSubject").textContent = exam.subject;
    $("examScreen").hidden = false;
    document.body.style.overflow = "hidden";
    if (!cur.qs.length) {
      const body = $("exBody");
      body.innerHTML = "";
      const empty = h("div", "empty");
      empty.appendChild(h("p", null, "الامتحان لسه مفيهوش أسئلة."));
      body.appendChild(empty);
      $("exProgress").textContent = "";
      cur.mode = "close";
      setFoot("رجوع", false);
      return;
    }
    showQ();
  }

  function showQ() {
    const q = cur.qs[cur.i];
    cur.locked = false;
    $("exProgress").textContent = "سؤال " + ar(cur.i + 1) + " من " + ar(cur.qs.length);
    const body = $("exBody");
    body.innerHTML = "";
    body.parentNode.scrollTop = 0;

    const card = h("div", "q");
    const ring = h("div", "ring");
    ring.innerHTML = '<svg viewBox="0 0 100 100" aria-hidden="true"><circle class="bg" cx="50" cy="50" r="45"/><circle class="fg" id="ringFg" cx="50" cy="50" r="45"/></svg><span id="ringNum"></span>';
    card.appendChild(ring);
    card.appendChild(h("span", "chip qtype", q.kind === "tf" ? "صح وغلط" : "اختيار من متعدد"));
    card.appendChild(h("p", "q-body", q.body));

    // صورة السؤال (مسألة)
    if (q.image_url) {
      const im = document.createElement("img");
      im.className = "q-img";
      im.alt = "";
      im.src = q.image_url;
      card.appendChild(im);
    }

    const opts = h("div", "opts");
    const list = (q.options && q.options.length) ? q.options : ["صح", "غلط"];
    cur.optEls = list.map((txt, idx) => {
      const o = h("button", "opt");
      o.type = "button";
      o.appendChild(h("span", "dot"));
      o.appendChild(h("span", null, String(txt)));
      o.setAttribute("aria-pressed", "false");
      o.addEventListener("click", () => reveal(idx));
      opts.appendChild(o);
      return o;
    });
    card.appendChild(opts);

    const fb = h("div", "fb");
    fb.id = "fb";
    fb.hidden = true;
    card.appendChild(fb);
    body.appendChild(card);
    setFoot("اختار إجابة", true);

    const fg = $("ringFg"), num = $("ringNum"), t0 = now();
    fg.style.strokeDasharray = CIRC;
    clearInterval(cur.timer);
    const tick = () => {
      const el = now() - t0, left = Math.max(0, QSEC * 1000 - el);
      fg.style.strokeDashoffset = CIRC * Math.min(1, el / (QSEC * 1000));
      num.textContent = ar(Math.ceil(left / 1000));
      // أزرق ← أصفر ← أحمر
      ring.classList.toggle("mid", left <= 6000 && left > 3000);
      ring.classList.toggle("low", left <= 3000);
      if (left <= 0 || now() >= cur.endsAt) reveal(null);
    };
    tick();
    cur.timer = setInterval(tick, 100);
  }

  async function reveal(choice) {
    if (cur.locked) return;
    cur.locked = true;
    clearInterval(cur.timer);
    const q = cur.qs[cur.i];
    cur.optEls.forEach((o) => { o.disabled = true; });
    if (choice != null) cur.optEls[choice].setAttribute("aria-pressed", "true");
    setFoot("ثانية واحدة...", true);

    let r = null;
    try {
      const x = await sb.rpc("check_answer", { p_exam_id: cur.exam.id, p_question_id: q.id, p_choice: choice == null ? -1 : choice });
      if (!x.error) r = x.data;
    } catch (e) {}

    const status = choice == null ? "skip" : (r && r.is_correct ? "right" : "wrong");
    cur.res[cur.i] = { id: q.id, choice: choice, status: status };
    const good = r ? cur.optEls[r.correct_index] : null;
    if (good) good.classList.add("right");
    if (status === "wrong") cur.optEls[choice].classList.add("wrong");

    const fb = $("fb");
    fb.className = "fb " + status;
    fb.innerHTML = "";
    const stg = h("strong");
    stg.innerHTML = ICON[status] + "<span></span>";
    stg.lastChild.textContent = status === "right" ? "إجابة صحيحة" : status === "wrong" ? "إجابة خاطئة" : "انتهى الوقت (بنص درجة)";
    fb.appendChild(stg);
    const ex = (r && r.explanation) || "";
    if (good && status !== "right") fb.appendChild(h("div", null, "الإجابة الصحيحة: " + good.textContent));
    if (status === "right") fb.appendChild(h("div", "fb-ex", "ليه صح: " + (ex || "إجابتك مطابقة للإجابة الصحيحة.")));
    else if (status === "wrong") fb.appendChild(h("div", "fb-ex", "ليه إجابتك غلط: " + (ex || "مش مطابقة للإجابة الصحيحة.")));
    else fb.appendChild(h("div", "fb-ex", "ليه دي الإجابة الصح: " + (ex || "دي الإجابة الصحيحة للسؤال.")));
    if (!r) fb.appendChild(h("div", null, "ماقدرناش نجيب الإجابة الصحيحة."));
    fb.hidden = false;
    fb.scrollIntoView({ block: "nearest", behavior: "smooth" });
    setFoot(cur.i + 1 >= cur.qs.length ? "عرض النتيجة" : "السؤال التالي", false);
  }

  function nextQ() {
    if (!cur.locked || cur.finishing) return;
    cur.i++;
    if (cur.i >= cur.qs.length || now() >= cur.endsAt) {
      for (let k = cur.i; k < cur.qs.length; k++) cur.res[k] = { id: cur.qs[k].id, choice: null, status: "skip" };
      finish();
    } else {
      showQ();
    }
  }

  function closeExamScreen() {
    clearInterval(cur.timer);
    $("examScreen").hidden = true;
    document.body.style.overflow = "";
  }

  async function finish() {
    cur.finishing = true;
    setFoot("بنسلّم...", true);
    const answers = {};
    cur.res.forEach((x) => { answers[x.id] = x.choice == null ? -1 : x.choice; });
    let sr = null;
    try {
      const r = await sb.rpc("submit_exam", { p_exam_id: cur.exam.id, p_answers: answers });
      if (!r.error) sr = r.data;
    } catch (e) {}
    closeExamScreen();

    const c = { right: 0, wrong: 0, skip: 0 };
    cur.res.forEach((x) => { c[x.status]++; });
    const total = cur.qs.length, score = c.right + c.skip * 0.5;
    const pp = (sr && sr.pass_percent) || 50;
    const passed = total > 0 && (score / total) * 100 >= pp;

    await loadExams();
    openModal((box) => {
      box.appendChild(h("h2", null, "تم تسليم الامتحان"));
      box.appendChild(h("p", "sub", cur.exam.subject));
      box.appendChild(h("div", "result-score", arNum(score) + " / " + ar(total)));
      box.appendChild(h("div", "result-note " + (passed ? "ok" : "no"), passed ? "ناجح" : "لم تنجح (المطلوب " + ar(pp) + "٪)"));
      const st = h("div", "stats");
      [["ok", c.right, "صح"], ["no", c.wrong, "خطأ"], ["half", c.skip, "لم تجاوب"]].forEach((s) => {
        const d = h("div", "stat " + s[0]);
        d.appendChild(h("strong", null, ar(s[1])));
        d.appendChild(h("span", null, s[2]));
        st.appendChild(d);
      });
      box.appendChild(st);
      // نص الدرجة بتبان بوضوح
      if (c.skip) box.appendChild(h("div", "half-note", "اتحسب لك نص درجة على " + ar(c.skip) + " سؤال ما جاوبتش = " + arNum(c.skip * 0.5) + " درجة"));
      const actions = h("div", "actions");
      actions.appendChild(modalBtn("تمام", "btn-primary", closeModal));
      box.appendChild(actions);
    }, true);
  }

  $("exSubmit").addEventListener("click", () => {
    if (cur.mode === "close") { closeExamScreen(); loadExams(); return; }
    nextQ();
  });

  /* ============ الأوائل ============ */
  const CROWN = '<svg class="crown" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5L3 8z"/></svg>';
  const shortName = (n) => (n || "طالب").trim().split(/\s+/).slice(0, 2).join(" ");

  function podiumSlot(row, cls) {
    const d = h("div", "pod " + cls + (row ? "" : " ghost"));
    if (!row) { d.appendChild(h("div", "pod-block")); return d; }
    if (cls === "p1") { const c = h("span"); c.innerHTML = CROWN; d.appendChild(c.firstChild); }
    d.appendChild(avatarEl(row.avatar_url, row.full_name));
    d.appendChild(h("div", "pod-name", shortName(row.full_name)));
    d.appendChild(h("div", "pod-pts", ar(row.points) + " نقطة"));
    d.appendChild(h("div", "pod-block", ar(row.place)));
    return d;
  }

  function lbRow(row) {
    const r = h("div", "lb-row" + (row.user_id === me.id ? " me" : ""));
    r.appendChild(h("span", "lb-rank", "#" + ar(row.place)));
    r.appendChild(avatarEl(row.avatar_url, row.full_name));
    r.appendChild(h("span", "lb-name", row.full_name || "طالب"));
    const pts = h("span", "lb-pts", ar(row.points));
    pts.appendChild(h("small", null, "نقطة"));
    r.appendChild(pts);
    return r;
  }

  function renderLeaders(rows) {
    const body = $("lbBody");
    body.innerHTML = "";
    $("lbUpdated").textContent = "آخر تحديث للقائمة: " + fStamp.format(new Date(now()));

    if (!rows.length) {
      const empty = h("div", "empty");
      empty.style.marginTop = "16px";
      empty.appendChild(h("p", null, "لسه محدش سلّم امتحان. الترتيب هيظهر هنا بعد أول تسليم."));
      body.appendChild(empty);
      return;
    }

    const meta = h("div", "lb-meta");
    // ترتيبك أنت (بيختلف من طالب للتاني)
    const mine = rows.find((x) => x.user_id === me.id);
    meta.appendChild(h("span", "chip mine", mine ? "ترتيبك: #" + ar(mine.place) : "ترتيبك: لسه مفيش"));
    if (state.studentsCount != null) {
      meta.appendChild(h("span", "chip total", ar(state.studentsCount) + " طالب على المنصة"));
    }
    body.appendChild(meta);

    const podium = h("div", "podium");
    podium.appendChild(podiumSlot(rows[1] || null, "p2"));
    podium.appendChild(podiumSlot(rows[0] || null, "p1"));
    podium.appendChild(podiumSlot(rows[2] || null, "p3"));
    body.appendChild(podium);

    const list = h("div", "lb-list");
    rows.slice(3).forEach((row) => list.appendChild(lbRow(row)));
    body.appendChild(list);
  }

  async function loadLeaders() {
    $("perMonth").setAttribute("aria-pressed", state.period === "month" ? "true" : "false");
    $("perAll").setAttribute("aria-pressed", state.period === "all" ? "true" : "false");
    let rows = [];
    try {
      const c = await sb.rpc("get_students_count");
      if (!c.error && c.data != null) state.studentsCount = Number(c.data);
    } catch (e) {}
    try {
      const r = await sb.rpc("get_leaderboard", { p_period: state.period });
      if (!r.error && r.data) rows = r.data.map((x) => ({
        place: Number(x.place), user_id: x.user_id, full_name: x.full_name,
        avatar_url: x.avatar_url, points: Number(x.points)
      }));
    } catch (e) {}
    renderLeaders(rows);
  }
  $("perMonth").addEventListener("click", () => { state.period = "month"; loadLeaders(); });
  $("perAll").addEventListener("click", () => { state.period = "all"; loadLeaders(); });

  /* ============ درجات الطالب: جدول لكل جولة امتحانات ============ */
  const gstate = { exams: [], att: {} };
  const fmtNum = (n) => ar(String(Math.round(Number(n) * 10) / 10).replace(".", "٫"));
  function gradeOf(p) {
    if (p >= 85) return ["ممتاز", "a"];
    if (p >= 75) return ["جيد جداً", "b"];
    if (p >= 65) return ["جيد", "b"];
    if (p >= 50) return ["مقبول", "c"];
    return ["راسب", "f"];
  }
  const gDone = (e) => (gstate.att[e.id] && gstate.att[e.id].submitted_at) || new Date(e.ends_at).getTime() <= now();

  function gTable(round, exams) {
    const wrap = h("div");
    wrap.appendChild(h("h2", "g-cap", "جدول الجولة " + ar(round)));
    const t = h("table", "g-table");
    const thead = h("thead"), head = h("tr");
    ["المادة", "الدرجة", "التقدير"].forEach((x) => head.appendChild(h("th", null, x)));
    thead.appendChild(head);
    t.appendChild(thead);
    const tb = h("tbody");
    exams.forEach((e) => {
      const a = gstate.att[e.id], has = a && a.submitted_at;
      const tr = h("tr");
      tr.appendChild(h("td", null, e.subject));
      tr.appendChild(h("td", "g-score", has ? fmtNum(a.score) + " / " + fmtNum(a.total) : "—"));
      const td = h("td");
      if (has) {
        const gr = gradeOf((Number(a.score) / (Number(a.total) || 1)) * 100);
        td.appendChild(h("span", "g-grade " + gr[1], gr[0]));
      } else if (new Date(e.ends_at).getTime() <= now()) {
        td.appendChild(h("span", "g-grade f", "غايب"));
      } else {
        td.appendChild(h("span", "g-grade", "لسه"));
      }
      tr.appendChild(td);
      tb.appendChild(tr);
    });
    t.appendChild(tb);
    wrap.appendChild(t);
    return wrap;
  }

  function renderGrades() {
    const av = $("gAvatar");
    av.innerHTML = "";
    av.appendChild(avatarEl(me.avatar, me.fullName));
    $("gName").textContent = me.fullName || "حسابك";
    $("gMail").textContent = (me.user && me.user.email) || "";
    $("term1").parentNode.hidden = true;

    const body = $("gBody");
    body.innerHTML = "";
    const rounds = Array.from(new Set(gstate.exams.map((e) => e.round_no || 1))).sort((a, b) => a - b);
    let shown = 0;
    rounds.forEach((r, i) => {
      const list = gstate.exams.filter((e) => (e.round_no || 1) === r);
      // الجدول التاني يظهر بس لما الجولة اللي قبله تخلص
      if (i > 0) {
        const prev = gstate.exams.filter((e) => (e.round_no || 1) === rounds[i - 1]);
        if (!prev.every(gDone)) return;
      }
      body.appendChild(gTable(r, list));
      shown++;
    });
    if (!shown) {
      const empty = h("div", "empty");
      empty.style.marginTop = "14px";
      empty.appendChild(h("p", null, "مفيش امتحانات لسه."));
      body.appendChild(empty);
    }
  }

  async function loadGrades() {
    renderGrades();
    let exams = [];
    const att = {};
    try {
      const r = await sb.from("exams").select("id, subject, round_no, starts_at, ends_at").order("starts_at", { ascending: true });
      if (!r.error && r.data) exams = r.data;
    } catch (e) {}
    try {
      const a = await sb.from("attempts").select("exam_id, submitted_at, score, total").eq("user_id", me.id);
      if (!a.error && a.data) a.data.forEach((x) => { att[x.exam_id] = x; });
    } catch (e) {}
    gstate.exams = exams;
    gstate.att = att;
    renderGrades();
  }

  /* ============ الإعدادات: الصورة والحساب ============ */
  function paintAvatars() {
    const a1 = $("setAvatar"), a2 = $("accAvatar"), a3 = $("navAvatar");
    a1.innerHTML = ""; a2.innerHTML = ""; a3.innerHTML = "";
    a1.appendChild(avatarEl(me.avatar, me.fullName, "lg"));
    a2.appendChild(avatarEl(me.avatar, me.fullName));
    a3.appendChild(avatarEl(me.avatar, me.fullName, "sm"));
    $("setName").textContent = me.fullName || "حسابك";
    $("accName").textContent = me.fullName || "حسابك";
    $("accEmail").textContent = (me.user && me.user.email) || "";
    $("accGender").textContent = me.gender === "female" ? "أنثى" : me.gender === "male" ? "ذكر" : "";
  }

  function paintGender() {
    Array.prototype.forEach.call($("genderSeg").children, (b) => {
      b.setAttribute("aria-pressed", b.dataset.g === me.gender ? "true" : "false");
    });
  }

  function paintSwatches() {
    const box = $("swatches");
    box.innerHTML = "";
    const current = window.QB.currentAccent().id;
    const dark = window.QB.isDark();
    window.QB.ACCENTS.forEach((a) => {
      const b = h("button", "swatch");
      b.type = "button";
      b.title = a.name;
      b.setAttribute("aria-label", a.name);
      b.style.background = dark ? a.dark : a.light;
      b.setAttribute("aria-pressed", a.id === current ? "true" : "false");
      b.innerHTML = ICON.check;
      b.addEventListener("click", () => {
        try { localStorage.setItem("qb-accent", a.id); } catch (e) {}
        window.QB.applyAccent();
        paintSwatches();
      });
      box.appendChild(b);
    });
  }

  function renderSettings() {
    paintAvatars();
    paintGender();
    paintSwatches();
    paintTheme();
    paintInstall();
    if (document.activeElement !== $("phone")) $("phone").value = me.phone || "";
  }

  async function saveAvatar(value) {
    let res = null;
    try { res = await sb.from("profiles").update({ avatar_url: value }).eq("id", me.id); } catch (e) { res = { error: e }; }
    if (res.error) return false;
    me.avatar = value;
    paintAvatars();
    return true;
  }

  function openAvatarMenu() {
    openModal((box) => {
      box.appendChild(h("h2", null, "صورة الحساب"));
      const menu = h("div", "menu");
      const item = (icon, label, fn, cls, disabled) => {
        const b = h("button", "menu-item" + (cls ? " " + cls : ""));
        b.type = "button";
        b.innerHTML = icon;
        b.appendChild(h("span", null, label));
        if (disabled) b.disabled = true;
        b.addEventListener("click", fn);
        menu.appendChild(b);
      };
      item(ICON.eye, "عرض الصورة", openViewer);
      item(ICON.image, "تغيير الصورة", () => { closeModal(); $("avatarFile").click(); });
      item(ICON.user, "اختيار أفاتار", openPresetPicker);
      item(ICON.trash, "حذف الصورة", openDeleteConfirm, "danger", !me.avatar);
      box.appendChild(menu);
      const actions = h("div", "actions");
      actions.appendChild(modalBtn("إلغاء", "btn-ghost", closeModal));
      box.appendChild(actions);
    });
  }

  function openViewer() {
    openModal((box) => {
      const v = h("div", "viewer");
      v.appendChild(avatarEl(bigUrl(me.avatar), me.fullName, "xl"));
      v.appendChild(h("div", "profile-name", me.fullName || "حسابك"));
      box.appendChild(v);
      const actions = h("div", "actions");
      actions.appendChild(modalBtn("إغلاق", "btn-ghost", closeModal));
      box.appendChild(actions);
    });
  }

  function openPresetPicker() {
    openModal((box) => {
      box.appendChild(h("h2", null, "اختار أفاتار"));
      const grid = h("div", "presets");
      [["boy", "ولد"], ["girl", "بنت"]].forEach((p) => {
        const b = h("button", "preset");
        b.type = "button";
        b.setAttribute("aria-pressed", presetKey(me.avatar) === p[0] ? "true" : "false");
        b.appendChild(avatarEl("preset:" + p[0], me.fullName, "md"));
        b.appendChild(h("span", null, p[1]));
        b.addEventListener("click", async () => {
          const ok = await saveAvatar("preset:" + p[0]);
          if (ok) { closeModal(); toast("اتغيّر الأفاتار"); }
          else toast("ماقدرناش نغيّر الأفاتار، جرّب تاني.", true);
        });
        grid.appendChild(b);
      });
      box.appendChild(grid);
      const actions = h("div", "actions");
      actions.appendChild(modalBtn("رجوع", "btn-ghost", openAvatarMenu));
      box.appendChild(actions);
    });
  }

  function openDeleteConfirm() {
    openModal((box) => {
      box.appendChild(h("h2", null, "حذف الصورة؟"));
      box.appendChild(h("p", "sub", "هيظهر بدالها أول حرف من اسمك."));
      const actions = h("div", "actions");
      const del = h("button", "btn-danger", "احذف");
      del.type = "button";
      del.addEventListener("click", async () => {
        del.disabled = true;
        const ok = await saveAvatar(null);
        if (ok) {
          closeModal();
          toast("اتحذفت الصورة");
          try { sb.storage.from("avatars").remove([me.id + "/avatar.jpg"]); } catch (e) {}
        } else {
          del.disabled = false;
          toast("ماقدرناش نحذف الصورة، جرّب تاني.", true);
        }
      });
      actions.appendChild(del);
      actions.appendChild(modalBtn("إلغاء", "btn-ghost", closeModal));
      box.appendChild(actions);
    });
  }

  $("avatarEdit").addEventListener("click", openAvatarMenu);

  async function resizeToBlob(file, size) {
    let bmp = null;
    try { bmp = await createImageBitmap(file, { imageOrientation: "from-image" }); }
    catch (e) { bmp = await createImageBitmap(file); }
    const s = Math.min(bmp.width, bmp.height);
    const c = document.createElement("canvas");
    c.width = c.height = size;
    c.getContext("2d").drawImage(bmp, (bmp.width - s) / 2, (bmp.height - s) / 2, s, s, 0, 0, size, size);
    return await new Promise((resolve) => c.toBlob(resolve, "image/jpeg", 0.85));
  }

  $("avatarFile").addEventListener("change", async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    if (!/^image\//.test(file.type)) { toast("اختار صورة من فضلك.", true); return; }

    toast("بنرفع الصورة...", false, true);
    try {
      const blob = await resizeToBlob(file, 512);
      if (!blob) throw new Error("resize");
      const path = me.id + "/avatar.jpg";
      const up = await sb.storage.from("avatars").upload(path, blob, { upsert: true, contentType: "image/jpeg", cacheControl: "3600" });
      if (up.error) throw up.error;
      const url = sb.storage.from("avatars").getPublicUrl(path).data.publicUrl + "?v=" + Date.now();
      const ok = await saveAvatar(url);
      if (!ok) throw new Error("save");
      toast("اتغيّرت الصورة");
    } catch (err) {
      toast("ماقدرناش نغيّر الصورة، جرّب تاني.", true);
    }
  });

  /* ============ الإعدادات: النوع ورقم التليفون ============ */
  async function saveGender(g) {
    let res = null;
    try { res = await sb.from("profiles").update({ gender: g }).eq("id", me.id); } catch (e) { res = { error: e }; }
    if (res.error) return false;
    me.gender = g;
    return true;
  }
  Array.prototype.forEach.call($("genderSeg").children, (b) => {
    b.addEventListener("click", async () => {
      const g = b.dataset.g;
      if (g === me.gender) return;
      const ok = await saveGender(g);
      paintGender(); paintAvatars();
      if (ok) toast("اتحفظ النوع"); else toast("ماقدرناش نحفظ النوع، جرّب تاني.", true);
    });
  });

  function cleanPhone(raw) {
    return (raw || "").replace(/[\s-]/g, "").replace(/[٠-٩]/g, (d) => AR_DIGITS.indexOf(d));
  }
  const PHONE_RE = /^01[0125][0-9]{8}$/;
  async function savePhone(value) {
    let res = null;
    try {
      res = await sb.from("profile_private").upsert({ user_id: me.id, phone: value, updated_at: new Date().toISOString() });
    } catch (e) { res = { error: e }; }
    if (res.error) return false;
    me.phone = value;
    return true;
  }

  const phoneMsg = $("phoneMsg");
  $("phoneSave").addEventListener("click", async () => {
    const raw = cleanPhone($("phone").value);
    if (!PHONE_RE.test(raw)) {
      phoneMsg.className = "field-msg err";
      phoneMsg.textContent = raw ? "اكتب رقم موبايل مصري صحيح من ١١ رقم، يبدأ بـ ٠١." : "رقم التليفون مطلوب.";
      return;
    }
    const btn = $("phoneSave");
    btn.disabled = true;
    phoneMsg.className = "field-msg";
    phoneMsg.textContent = "";
    const ok = await savePhone(raw);
    btn.disabled = false;
    if (!ok) {
      phoneMsg.className = "field-msg err";
      phoneMsg.textContent = "ماقدرناش نحفظ الرقم، جرّب تاني.";
      return;
    }
    $("phone").value = raw;
    toast("اتحفظ رقم التليفون");
  });

  $("logoutBtn").addEventListener("click", async () => {
    try { await sb.auth.signOut(); } catch (e) {}
    goLogin();
  });

  /* ============ تثبيت التطبيق والإصدار ============ */
  $("appVer").textContent = ar(APP_VERSION);
  const isStandalone = () => (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
  const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  function paintInstall() {
    if (isStandalone()) {
      $("installBtn").disabled = true;
      $("installBtn").textContent = "التطبيق مثبّت ✔";
      $("installMsg").textContent = "";
    }
  }
  window.addEventListener("appinstalled", () => { window.__qbPrompt = null; paintInstall(); toast("اتثبّت التطبيق"); });
  $("installBtn").addEventListener("click", async () => {
    const msg = $("installMsg"), p = window.__qbPrompt;
    if (p) {
      // نافذة التثبيت الرسمية: بتثبّت التطبيق نفسه مش اختصار
      p.prompt();
      let c = null;
      try { c = await p.userChoice; } catch (e) {}
      window.__qbPrompt = null;
      msg.textContent = c && c.outcome === "accepted" ? "جاري تثبيت التطبيق..." : "";
      return;
    }
    if (isIOS()) {
      msg.textContent = "على الآيفون: اضغط زر المشاركة ثم «إضافة إلى الشاشة الرئيسية».";
      return;
    }
    msg.textContent = "التثبيت مش جاهز دلوقتي، حدّث الصفحة واستنى ثواني وجرّب تاني.";
  });
  paintInstall();
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});

  /* ============ إكمال البيانات الإجباري (النوع والتليفون) ============ */
  function openGate(needG, needP) {
    let g = null;
    openModal((box) => {
      box.appendChild(h("h2", null, "كمّل بياناتك"));
      box.appendChild(h("p", "sub", "محتاجين بيانات بسيطة قبل ما تكمّل."));

      let segEl = null, phoneEl = null;
      if (needG) {
        const f = h("div", "field");
        f.appendChild(h("span", "label", "النوع"));
        segEl = h("div", "seg");
        [["male", "ذكر"], ["female", "أنثى"]].forEach((o) => {
          const b = h("button", null, o[1]);
          b.type = "button";
          b.dataset.g = o[0];
          b.setAttribute("aria-pressed", "false");
          b.addEventListener("click", () => {
            g = o[0];
            Array.prototype.forEach.call(segEl.children, (c) => c.setAttribute("aria-pressed", c.dataset.g === g ? "true" : "false"));
            check();
          });
          segEl.appendChild(b);
        });
        f.appendChild(segEl);
        box.appendChild(f);
      }
      if (needP) {
        const f = h("div", "field");
        const lab = h("label", null, "رقم التليفون");
        lab.htmlFor = "gatePhone";
        f.appendChild(lab);
        phoneEl = h("input", "input");
        phoneEl.id = "gatePhone";
        phoneEl.type = "tel";
        phoneEl.inputMode = "numeric";
        phoneEl.autocomplete = "tel";
        phoneEl.placeholder = "01xxxxxxxxx";
        phoneEl.maxLength = 11;
        phoneEl.addEventListener("input", check);
        f.appendChild(phoneEl);
        box.appendChild(f);
      }
      const msg = h("p", "field-msg");
      box.appendChild(msg);

      const actions = h("div", "actions");
      const save = h("button", "btn-primary", "حفظ ومتابعة");
      save.type = "button";
      save.disabled = true;
      function check() {
        const okG = !needG || !!g;
        const okP = !needP || PHONE_RE.test(cleanPhone(phoneEl.value));
        save.disabled = !(okG && okP);
      }
      save.addEventListener("click", async () => {
        save.disabled = true;
        msg.className = "field-msg";
        msg.textContent = "";
        let ok = true;
        if (needG) ok = await saveGender(g);
        if (ok && needP) ok = await savePhone(cleanPhone(phoneEl.value));
        if (!ok) {
          msg.className = "field-msg err";
          msg.textContent = "ماقدرناش نحفظ البيانات، جرّب تاني.";
          check();
          return;
        }
        closeModal();
        renderSettings();
        toast("اتحفظت بياناتك");
      });
      actions.appendChild(save);
      box.appendChild(actions);
    }, true);
  }

  async function ensureProfile() {
    if (me.profileKnown && !me.gender) {
      const guess = guessGender(me.fullName);
      if (guess) await saveGender(guess);          // لو الاسم واضح بنحدد النوع لوحدنا
    }
    const needG = me.profileKnown && !me.gender;
    const needP = me.phoneKnown && !me.phone;
    if (needG || needP) openGate(needG, needP);
  }

  /* ============ تشغيل الصفحة ============ */
  function showApp() {
    $("bootView").hidden = true;
    $("appView").hidden = false;
    $("greet").textContent = me.fullName ? "أهلاً يا " + me.fullName : "أهلاً بيك";
    paintAvatars();

    // لو لسه راجع من جوجل نبدأ من الرئيسية، غير كده نرجع لآخر صفحة كنت فيها
    const hash = window.location.hash.replace("#", "");
    go(pages[hash] && !AUTH_REDIRECT ? hash : "home", true);
  }

  (async function init() {
    let session = null;
    try {
      const r = await sb.auth.getSession();
      session = r.data && r.data.session;
    } catch (e) {}
    if (!session) { goLogin(); return; }

    // بنجيب بيانات الطالب من Supabase قبل ما ندخّله
    let user = null, err = null;
    try {
      const ur = await sb.auth.getUser();
      user = ur.data && ur.data.user;
      err = ur.error;
    } catch (e) {}

    if (!user) {
      const expired = err && (err.status === 401 || err.status === 403 || err.name === "AuthSessionMissingError");
      if (expired) {
        try { await sb.auth.signOut(); } catch (e) {}
        goLogin();
        return;
      }
      user = session.user; // مفيش نت: نكمل بالبيانات المحفوظة
    }

    me.user = user;
    me.id = user.id;
    try { notif.seenAt = Number(localStorage.getItem(seenKey())) || 0; } catch (e) {}
    await Promise.all([loadProfile(), loadPhone(), syncClock()]);
    notif.login = loginStamp();
    mergeNotifs();
    showApp();
    updateBadge();
    loadNotifs();
    ensureProfile();
  })();

  sb.auth.onAuthStateChange((evt) => {
    if (evt === "SIGNED_OUT") goLogin();
  });
})();


  </script>
</body>
