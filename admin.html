<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>لوحة التحكم | بنك الأسئلة</title>
  <link rel="icon" type="image/png" href="https://i.supaimg.com/965e0c3e-50d9-4ba0-97dc-487d00fde583/ef7c87c4-67fe-4ba2-b901-69ca8ee7225d.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
  <style>
    :root {
      --bg:#f6f8fa; --surface:#fff; --surface-2:#f6f8fa; --fg:#1f2328; --muted:#59636e; --border:#d1d9e0;
      --accent:#0969da; --accent-fg:#fff; --danger:#cf222e; --ok:#1a7f37; --warn:#d29922;
      --shadow:rgba(31,35,40,.10); --side:248px;
      --font:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg:#0d1117; --surface:#151b23; --surface-2:#0d1117; --fg:#e6edf3; --muted:#9198a1; --border:#3d444d;
        --accent:#4493f8; --accent-fg:#0d1117; --danger:#f85149; --ok:#3fb950; --shadow:rgba(0,0,0,.45); color-scheme:dark;
      }
    }
    :root[data-theme="dark"] {
      --bg:#0d1117; --surface:#151b23; --surface-2:#0d1117; --fg:#e6edf3; --muted:#9198a1; --border:#3d444d;
      --accent:#4493f8; --accent-fg:#0d1117; --danger:#f85149; --ok:#3fb950; --shadow:rgba(0,0,0,.45); color-scheme:dark;
    }
    :root { --c-blue:#0a8fd8; --c-green:#1a7f37; --c-red:#d1495b; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --c-blue:#4bb4f1; --c-green:#3fb950; --c-red:#ff7b88; } }
    :root[data-theme="dark"] { --c-blue:#4bb4f1; --c-green:#3fb950; --c-red:#ff7b88; }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html { overflow-x:hidden; -webkit-text-size-adjust:100%; }
    body { margin:0; background:var(--bg); color:var(--fg); font-family:var(--font); font-size:16px; line-height:1.7; overflow-x:clip; }
    [hidden] { display:none !important; }
    button, input, textarea, select { font:inherit; color:inherit; }
    :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }

    .boot { min-height:100vh; display:grid; place-items:center; color:var(--muted); }
    .loader { width:34px; height:34px; border-radius:50%; border:3px solid var(--border); border-top-color:var(--accent); animation:spin .8s linear infinite; margin:0 auto 12px; }
    @keyframes spin { to { transform:rotate(360deg); } }

    .top { position:sticky; top:0; z-index:20; display:flex; align-items:center; justify-content:space-between; gap:10px; min-height:64px; padding:calc(8px + env(safe-area-inset-top)) 14px 8px 14px; background:var(--surface); border-bottom:1px solid var(--border); border-radius:0 0 24px 24px; box-shadow:0 8px 20px var(--shadow); }
    .brand { display:flex; align-items:center; gap:10px; font-weight:600; font-size:18px; min-width:0; }
    .brand svg { width:26px; height:26px; color:var(--accent); flex:none; }
    .menu-btn { width:44px; height:44px; flex:none; display:grid; place-items:center; border-radius:12px; border:1px solid transparent; background:transparent; color:var(--fg); cursor:pointer; }
    .menu-btn:hover, .menu-btn[aria-expanded="true"] { background:var(--surface-2); border-color:var(--border); }
    .menu-btn svg { width:24px; height:24px; }

    .scrim { position:fixed; inset:0; z-index:60; background:rgba(0,0,0,.5); opacity:0; visibility:hidden; transition:opacity .2s ease, visibility .2s ease; }
    .scrim.open { opacity:1; visibility:visible; }
    .drawer { position:fixed; top:0; bottom:0; right:0; z-index:70; width:min(310px,86vw); display:flex; flex-direction:column; gap:8px; padding:calc(14px + env(safe-area-inset-top)) 14px calc(16px + env(safe-area-inset-bottom)); background:var(--surface); border-left:1px solid var(--border); border-radius:24px 0 0 24px; box-shadow:0 0 40px var(--shadow); transform:translateX(105%); visibility:hidden; transition:transform .25s ease, visibility .25s ease; }
    .drawer.open { transform:none; visibility:visible; }
    .drawer-head { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:2px 4px 12px; border-bottom:1px solid var(--border); margin-bottom:4px; }
    .drawer-nav { flex:1; min-height:0; overflow:auto; display:flex; flex-direction:column; gap:6px; }
    .nav { flex:none; width:100%; display:flex; align-items:center; gap:14px; padding:13px 14px; border:0; border-radius:14px; background:none; color:var(--muted); cursor:pointer; font-size:16px; font-weight:600; text-align:start; }
    .nav svg { width:22px; height:22px; flex:none; }
    .nav:hover:not(.on) { background:var(--surface-2); color:var(--fg); }
    .nav.on { color:var(--accent); background:color-mix(in srgb, var(--accent) 14%, transparent); }
    .nav.back { margin-top:auto; border-top:1px solid var(--border); border-radius:0 0 14px 14px; padding-top:16px; }
    .main { max-width:1240px; margin:0 auto; padding:18px 16px calc(40px + env(safe-area-inset-bottom)); }
    h1.title { margin:0 0 16px; font-size:22px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    h1.title .sp { flex:1; }

    @media (min-width:1024px) {
      .top { padding-inline:28px; }
      .main { padding:30px 36px 48px; }
      h1.title { font-size:26px; }
    }

    .card { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:16px; box-shadow:0 2px 8px var(--shadow); }
    .card.click { cursor:pointer; }
    .card.click:hover { border-color:var(--accent); }
    .grid { display:grid; gap:14px; grid-template-columns:repeat(auto-fill, minmax(min(100%,340px),1fr)); }
    .stats4 { display:grid; gap:12px; grid-template-columns:repeat(auto-fit, minmax(140px,1fr)); margin-bottom:18px; }
    .stat { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:14px; }
    .stat b { display:block; font-size:28px; line-height:1.3; color:var(--accent); }
    .stat span { color:var(--muted); font-size:14px; }
    .btn { border-radius:10px; padding:10px 16px; font-weight:600; font-size:14.5px; cursor:pointer; border:1px solid transparent; }
    .btn.p { background:var(--accent); color:var(--accent-fg); }
    .btn.g { background:var(--surface-2); border-color:var(--border); }
    .btn.d { background:transparent; border-color:var(--danger); color:var(--danger); }
    .btn.s { padding:6px 12px; font-size:13.5px; }
    .btn:hover { filter:brightness(1.07); }
    button[disabled] { opacity:.55; cursor:not-allowed; }
    .chip { display:inline-block; font-size:12.5px; font-weight:600; padding:1px 10px; border-radius:999px; border:1px solid var(--border); color:var(--muted); background:var(--surface-2); }
    .chip.ok { color:var(--ok); border-color:var(--ok); } .chip.a { color:var(--accent); border-color:var(--accent); } .chip.w { color:var(--warn); border-color:var(--warn); }
    .muted { color:var(--muted); font-size:14px; }
    .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    .empty { text-align:center; color:var(--muted); padding:34px 16px; border:1px dashed var(--border); border-radius:14px; background:var(--surface); }
    .e-title { font-weight:600; font-size:18px; overflow-wrap:anywhere; }
    .kv { display:grid; gap:2px; font-size:14.5px; margin:8px 0 12px; }
    .kv span:first-child { color:var(--muted); }

    .av { width:38px; height:38px; flex:none; border-radius:50%; overflow:hidden; display:grid; place-items:center; background:var(--surface-2); border:1px solid var(--border); font-weight:600; font-size:13px; }
    .av img, .av svg { width:100%; height:100%; display:block; }
    .av img { object-fit:cover; }
    .who { display:flex; align-items:center; gap:10px; min-width:0; }
    .who div { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

    .tbl-wrap { overflow:auto; border:1px solid var(--border); border-radius:14px; background:var(--surface); max-height:70vh; }
    table { border-collapse:separate; border-spacing:0; width:100%; min-width:560px; }
    th, td { padding:10px 12px; text-align:center; border-bottom:1px solid var(--border); white-space:nowrap; font-size:14.5px; }
    th { position:sticky; top:0; background:var(--surface-2); color:var(--muted); font-size:13px; z-index:2; }
    th:first-child, td:first-child { position:sticky; inset-inline-start:0; text-align:start; background:var(--surface); z-index:1; min-width:190px; }
    th:first-child { background:var(--surface-2); z-index:3; }
    tr:last-child td { border-bottom:0; }
    td.cell { cursor:pointer; }
    td.cell:hover { background:var(--surface-2); }
    .good { color:var(--ok); font-weight:600; } .bad { color:var(--danger); font-weight:600; }

    .inp, .sel { width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--border); background:var(--surface-2); }
    textarea.inp { min-height:84px; resize:vertical; }
    .inp:focus { outline:2px solid var(--accent); border-color:var(--accent); }
    .fld { display:grid; gap:4px; font-size:14px; font-weight:500; }
    .seg { display:grid; grid-template-columns:1fr 1fr; gap:4px; padding:4px; border:1px solid var(--border); border-radius:12px; background:var(--surface-2); }
    .seg button { border:0; background:none; padding:8px; border-radius:9px; font-weight:600; cursor:pointer; color:var(--muted); }
    .seg button[aria-pressed="true"] { background:var(--accent); color:var(--accent-fg); }
    .optrow { display:flex; align-items:center; gap:10px; }
    .optrow input[type=radio] { width:20px; height:20px; accent-color:var(--accent); flex:none; }
    .err { color:var(--danger); font-size:13.5px; min-height:1.3em; margin:0; }

    .q-item { display:grid; gap:6px; padding:14px; }
    .q-item .t { font-weight:600; overflow-wrap:anywhere; }
    .q-img { width:100%; max-height:260px; object-fit:contain; background:#fff; border-radius:12px; border:1px solid var(--border); }

    .search { max-width:420px; }
    .sw { display:flex; flex-wrap:wrap; gap:10px; }
    .sw button { width:36px; height:36px; border-radius:50%; border:2px solid transparent; cursor:pointer; }
    .sw button[aria-pressed="true"] { border-color:var(--fg); box-shadow:0 0 0 2px var(--surface) inset; }
    .toggle { display:flex; align-items:center; justify-content:space-between; gap:12px; cursor:pointer; }
    .toggle input { position:absolute; opacity:0; }
    .tk { position:relative; width:56px; height:30px; border-radius:999px; background:var(--border); flex:none; transition:.2s; }
    .tk::after { content:""; position:absolute; top:3px; inset-inline-start:3px; width:24px; height:24px; border-radius:50%; background:#fff; transition:.2s; box-shadow:0 1px 3px rgba(0,0,0,.3); }
    .toggle input:checked + .tk { background:var(--accent); }
    .toggle input:checked + .tk::after { inset-inline-start:29px; }
    .stack { display:grid; gap:14px; max-width:560px; }

    .mb { position:fixed; inset:0; z-index:80; background:rgba(0,0,0,.55); display:grid; place-items:center; padding:14px; overflow:auto; }
    .modal { width:min(520px,100%); max-height:92vh; overflow:auto; background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:20px; display:grid; gap:12px; box-shadow:0 16px 40px var(--shadow); }
    .modal h2 { margin:0; font-size:20px; text-align:center; }
    .modal .sub { margin:0; text-align:center; color:var(--muted); }
    .actions { display:grid; gap:8px; grid-template-columns:1fr 1fr; margin-top:4px; }
    .toast { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(24px + env(safe-area-inset-bottom)); z-index:90; background:var(--fg); color:var(--bg); padding:10px 16px; border-radius:12px; max-width:calc(100vw - 32px); text-align:center; font-size:14.5px; }
    .toast.e { background:var(--danger); color:#fff; }
    @media (min-width:1024px) { .toast { bottom:28px; } }

    /* مراجعة التسليم */
    .rv-q { border:1px solid var(--border); border-radius:14px; padding:12px; display:grid; gap:8px; background:var(--surface-2); }
    .rv-q .t { font-weight:600; overflow-wrap:anywhere; }
    .rv-o { padding:8px 10px; border-radius:10px; border:1px solid var(--border); background:var(--surface); overflow-wrap:anywhere; font-size:14.5px; }
    .rv-o.right { border-color:var(--ok); background:color-mix(in srgb, var(--ok) 14%, var(--surface)); }
    .rv-o.wrong { border-color:var(--danger); background:color-mix(in srgb, var(--danger) 14%, var(--surface)); }
    .rv-tag { font-size:12.5px; font-weight:600; margin-inline-start:6px; }
    .seg3 { grid-template-columns:1fr 1fr 1fr; }
    .av.click { cursor:zoom-in; }
    .fullimg { width:100%; max-height:70vh; object-fit:contain; border-radius:14px; background:var(--surface-2); display:block; }
    .fullav { width:min(78vw,320px); height:min(78vw,320px); margin:0 auto; border-radius:28px; overflow:hidden; border:3px solid var(--border); display:grid; place-items:center; background:var(--surface-2); font-size:80px; font-weight:600; }
    .fullav svg, .fullav img { width:100%; height:100%; object-fit:cover; display:block; }
    .rv-img { width:100%; max-height:300px; object-fit:contain; background:#fff; border-radius:12px; border:1px solid var(--border); cursor:zoom-in; }
    .rv-lab { font-size:13px; font-weight:600; color:var(--muted); margin-top:4px; }
    .rv-grade { display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; }
    .btn.ok { background:transparent; border-color:var(--ok); color:var(--ok); }
    .chip.pend { color:var(--accent); border-color:var(--accent); }
    .ph { display:flex; align-items:center; gap:6px; justify-content:center; direction:ltr; }
    .ph a, .row a.btn { text-decoration:none; }
    .ph a.btn.g, .row a.btn.g { color:var(--fg); }
    .ph .btn { padding:4px 10px; font-size:12.5px; }
    .btn.wa { background:transparent; border-color:#25d366; color:#25d366; }
    .chip.red { color:var(--danger); border-color:var(--danger); }
    .nav .nb { margin-inline-start:auto; background:var(--danger); color:#fff; font-size:12px; font-weight:700; min-width:22px; height:22px; border-radius:999px; display:grid; place-items:center; padding:0 6px; }
    .rq { display:grid; gap:12px; }
    .rq-card { background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:14px; display:grid; gap:12px; }
    .rq-card.pending { border-color:var(--accent); box-shadow:0 0 0 1px color-mix(in srgb, var(--accent) 35%, transparent); }
    .rq-head { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
    .rq-head .nm { font-weight:700; font-size:16px; overflow-wrap:anywhere; }
    .rq-head .sm { color:var(--muted); font-size:13.5px; overflow-wrap:anywhere; }
    .rq-move { display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-weight:700; }
    .rq-move .arrow { color:var(--muted); }
    .rq-reason { background:var(--surface-2); border:1px solid var(--border); border-radius:12px; padding:10px 12px; white-space:pre-wrap; overflow-wrap:anywhere; }
    .rq-proof { width:100%; max-height:260px; object-fit:contain; background:#000; border-radius:12px; cursor:zoom-in; display:block; min-height:60px; }
    .rq-act { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .rq-ph { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
    .rq-alert { display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:14px; border:1px solid var(--accent); background:color-mix(in srgb, var(--accent) 12%, var(--surface)); cursor:pointer; margin-bottom:16px; font-weight:600; }
    .rq-alert b { color:var(--accent); font-size:20px; }
    .stars { display:inline-flex; gap:2px; direction:ltr; }
    .stars svg { width:18px; height:18px; fill:none; stroke:#f5a524; stroke-width:1.8; }
    .stars svg.on { fill:#f5a524; }
    .dist { display:grid; gap:8px; margin:6px 0 18px; }
    .dist .r { display:grid; grid-template-columns:44px 1fr 34px; gap:10px; align-items:center; font-size:14px; }
    .dist .bar { height:10px; border-radius:999px; background:var(--surface-2); border:1px solid var(--border); overflow:hidden; }
    .dist .bar i { display:block; height:100%; background:#f5a524; border-radius:999px; }
    .tg-sw { display:grid; grid-template-columns:1fr 1fr; gap:4px; padding:4px; background:var(--surface-2); border:1px solid var(--border); border-radius:12px; }
    .tg-sw button { border:0; background:transparent; padding:9px; border-radius:9px; font-weight:600; cursor:pointer; color:var(--muted); }
    .tg-sw button[aria-pressed="true"] { background:var(--accent); color:var(--accent-fg); }
    .tg-grp { border:1px solid var(--border); border-radius:14px; padding:10px; display:grid; gap:8px; background:var(--surface-2); }
    .tg-hd { display:flex; align-items:center; justify-content:space-between; gap:8px; font-weight:700; }
    .tg-grid { display:grid; grid-template-columns:repeat(8, 1fr); gap:6px; }
    .tg-grid button { border:1px solid var(--border); background:var(--surface); color:var(--fg); border-radius:9px; padding:7px 0; font-size:14px; font-weight:600; cursor:pointer; }
    .tg-grid button[aria-pressed="true"] { background:var(--accent); color:var(--accent-fg); border-color:var(--accent); }
    .tg-sum { font-size:13.5px; color:var(--muted); margin:0; }
    .ins { margin-bottom:20px; padding:0; overflow:hidden; }
    .ins-top { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; padding:14px 16px; border-bottom:1px solid var(--border); }
    .ins-range { display:flex; align-items:center; gap:12px; min-width:0; }
    .ins-range svg { width:28px; height:28px; flex:none; }
    .ins-range b { display:block; font-size:17px; line-height:1.4; }
    .ins-range span { display:block; color:var(--muted); font-size:14px; line-height:1.4; }
    .ins-seg { width:178px; }
    .ins-body { padding:16px; }
    .ins-h { margin:0 0 8px; font-size:19px; display:flex; align-items:center; gap:8px; }
    .ins-row { max-width:520px; display:flex; align-items:center; gap:10px; padding:6px 0; font-size:16px; }
    .ins-row .dot { width:10px; height:10px; border-radius:50%; flex:none; }
    .ins-row .lbl { flex:1; color:var(--muted); }
    .ins-row b { font-size:17px; font-variant-numeric:tabular-nums; }
    .dot.blue { background:var(--c-blue); } .dot.green { background:var(--c-green); } .dot.red { background:var(--c-red); }
    .chart { direction:ltr; margin-top:14px; }
    .chart svg { width:100%; height:auto; max-height:300px; display:block; touch-action:pan-y; }
    .chart .gl { stroke:var(--border); stroke-width:1; }
    .chart text { fill:var(--muted); font-size:11px; font-family:inherit; }
    .chart .ln { fill:none; stroke-width:2; stroke-linejoin:round; stroke-linecap:round; }
    .chart .ln.blue { stroke:var(--c-blue); } .chart .ln.green { stroke:var(--c-green); } .chart .ln.red { stroke:var(--c-red); }
    .chart .mk { stroke:var(--muted); stroke-width:1; stroke-dasharray:3 3; }
    .chart .hit { fill:transparent; cursor:pointer; }
    .readout { min-height:1.7em; margin:6px 0 0; text-align:center; font-size:13.5px; color:var(--muted); }
    .act-h { margin:18px 0 4px; font-size:17px; }
    .act-row { display:flex; align-items:center; gap:10px; padding:10px 0; border-top:1px solid var(--border); }
    .act-row .who { flex:1; }
    .act-row .who small { display:block; color:var(--muted); font-size:12.5px; overflow:hidden; text-overflow:ellipsis; }
    .upl { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  </style>
  <script>
    (function () {
      var ACC = { blue:["#0969da","#4493f8"], green:["#1a7f37","#3fb950"], purple:["#8250df","#a371f7"], orange:["#bc4c00","#f0883e"], pink:["#bf3989","#f778ba"], teal:["#0e7c86","#39c5cf"], red:["#cf222e","#ff7b72"] };
      function dark() { var t = document.documentElement.getAttribute("data-theme"); return t ? t === "dark" : !!(window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches); }
      function apply() { var id = "blue"; try { id = localStorage.getItem("qb-accent") || "blue"; } catch (e) {} var a = ACC[id] || ACC.blue, d = dark(), s = document.documentElement.style; s.setProperty("--accent", d ? a[1] : a[0]); s.setProperty("--accent-fg", d ? "#0d1117" : "#fff"); }
      window.QBA = { ACC: ACC, dark: dark, apply: apply };
      try { var t = localStorage.getItem("qb-theme"); if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t); } catch (e) {}
      apply();
    })();
  </script>
</head>
<body>
  <div class="boot" id="boot"><div><div class="loader"></div>بنتأكد من الصلاحية...</div></div>

  <div id="app" hidden>

        girl: '<svg viewBox="0 0 100 100"><rect width="100" height="100" fill="#ffd9e8"/><path d="M25 58c-4-24 6-42 25-42s29 18 25 42c-1 8-3 14-3 22H28c0-8-2-14-3-22z" fill="#3a2418"/><path d="M16 100c0-20 15-32 34-32s34 12 34 32z" fill="#c2417d"/><rect x="43" y="55" width="14" height="16" rx="6" fill="#e3a982"/><circle cx="50" cy="42" r="18" fill="#f2c29c"/><path d="M31 43c-2-16 8-26 19-26s21 10 19 26c-4-10-9-15-19-15s-15 5-19 15z" fill="#3a2418"/><circle cx="43" cy="45" r="2" fill="#2b2118"/><circle cx="57" cy="45" r="2" fill="#2b2118"/><path d="M44 52c3.500 3 8.500 3 12 0" stroke="#b5483a" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="38" cy="50" r="3" fill="#f59aa8" opacity=".5"/><circle cx="62" cy="50" r="3" fill="#f59aa8" opacity=".5"/></svg>'
      };

      /* ---------- الجلسة ---------- */
      const keep = () => { try { return localStorage.getItem("qb-remember") !== "0"; } catch (e) { return true; } };
      const store = {
        getItem: (k) => { try { return localStorage.getItem(k) || sessionStorage.getItem(k); } catch (e) { return null; } },
        setItem: (k, v) => { try { const K = keep(); (K ? localStorage : sessionStorage).setItem(k, v); (K ? sessionStorage : localStorage).removeItem(k); } catch (e) {} },
        removeItem: (k) => { try { localStorage.removeItem(k); sessionStorage.removeItem(k); } catch (e) {} }
      };
      const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { storage: store } });
      const go = (p) => location.replace(new URL(p, location.href).href);

      /* ---------- نافذة وتنبيه ---------- */
      let onCancel = null, tt = null;
      function toast(m, bad) { const t = $("toast"); t.textContent = m; t.className = "toast" + (bad ? " e" : ""); t.hidden = false; clearTimeout(tt); tt = setTimeout(() => { t.hidden = true; }, 3200); }
      function modal(build) { const b = $("mbox"); b.innerHTML = ""; build(b); $("modal").hidden = false; }
      function closeModal() { $("modal").hidden = true; if (onCancel) { const f = onCancel; onCancel = null; f(); } }
      $("modal").addEventListener("click", (e) => { if (e.target === $("modal")) closeModal(); });
      document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("modal").hidden) closeModal(); });
      const btn = (label, cls, fn) => { const b = h("button", "btn " + cls, label); b.type = "button"; b.addEventListener("click", fn); return b; };
      function ask(title, text, ok, danger) {
        return new Promise((res) => {
          modal((b) => {
            b.appendChild(h("h2", null, title));
            b.appendChild(h("p", "sub", text));
            const a = h("div", "actions");
            a.appendChild(btn(ok, danger ? "d" : "p", () => { onCancel = null; closeModal(); res(true); }));
            a.appendChild(btn("إلغاء", "g", () => closeModal()));
            b.appendChild(a);
          });
          onCancel = () => res(false);
        });
      }

      /* ---------- البيانات ---------- */
      const S = { tab: "overview", exams: [], qs: [], students: [], atts: [], notifs: [], events: [], range: 30, showAll: false, subSearch: "", subExam: "all", gSearch: "", gGrp: "all", gSec: "all", qExam: null, search: "", reqs: [], ratings: [], reqFilter: "pending", reqOk: true, rateOk: true };
      async function pullAll(table) {
        let all = [];
        for (let pg = 0; pg < 30; pg++) {
          const r = await sb.from(table).select("*").range(pg * 1000, pg * 1000 + 999);
          if (r.error) throw r.error;
          const d = r.data || []; all = all.concat(d);
          if (d.length < 1000) break;
        }
        return all;
      }
      async function pull(p) { const r = await p; if (r.error) throw r.error; return r.data || []; }
      async function loadAll(silent) {
        try {
          const [ex, qs, st, at, nt] = await Promise.all([
            pull(sb.from("exams").select("*").order("starts_at", { ascending: false })),
            pull(sb.from("questions").select("*").order("created_at", { ascending: true })),
            pull(sb.rpc("admin_students")),
            pullAll("attempts"),
            pull(sb.from("notifications").select("id, title, body, created_at").order("created_at", { ascending: false }).limit(30))
          ]);
          S.exams = ex; S.qs = qs; S.students = st; S.atts = at; S.notifs = nt;
          try {
            const pr = await sb.from("profiles").select("id, avatar_url, full_name, gender");
            if (!pr.error && pr.data) {
              const pm = {}; pr.data.forEach((p) => { pm[p.id] = p; });
              S.students.forEach((x) => { const p = pm[x.id]; if (p) { x.avatar_url = p.avatar_url || null; if (p.full_name) x.full_name = p.full_name; if (p.gender) x.gender = p.gender; } });
            }
          } catch (e2) {}
        } catch (e) { if (!silent) toast("ماقدرناش نحمّل البيانات: " + em(e) + " (شغّل update-v3.sql و update-v4.sql و update-v5.sql)", true); return; }
        try {
          const since = new Date(Date.now() - 31 * 86400e3).toISOString(); let all = [];
          for (let pg = 0; pg < 10; pg++) {
            const ev = await sb.from("user_events").select("*").gte("created_at", since).order("created_at", { ascending: false }).range(pg * 1000, pg * 1000 + 999);
            if (ev.error) { all = []; break; }
            all = all.concat(ev.data || []); if ((ev.data || []).length < 1000) break;
          }
          S.events = all;
        } catch (e3) { S.events = []; }
        try { const r = await sb.rpc("admin_group_requests"); if (r.error) throw r.error; S.reqs = r.data || []; S.reqOk = true; } catch (e4) { S.reqs = []; S.reqOk = false; }
        try { const r = await sb.rpc("admin_site_ratings"); if (r.error) throw r.error; S.ratings = r.data || []; S.rateOk = true; } catch (e5) { S.ratings = []; S.rateOk = false; }
        paintBadges();
        // ما نعيدش الرسم لو فيه نافذة مفتوحة أو بيكتب في بحث
        if (silent && (!$("modal").hidden || (document.activeElement && document.activeElement.tagName === "INPUT"))) return;
        render();
      }
      const examOf = (id) => S.exams.find((x) => x.id === id);
      const studOf = (id) => S.students.find((x) => x.id === id);
      const qOf = (eid) => S.qs.filter((q) => q.exam_id === eid);
      const isTF = (q) => q.kind === "tf" || !(q.options && q.options.length);
      const phoneClean = (p) => String(p || "").replace(/[^\d]/g, "");
      const waNum = (p) => { const d = phoneClean(p); return d.indexOf("0") === 0 ? "20" + d.slice(1) : d; };
      function phoneCell(p) {
        const td = h("td");
        if (!p) { td.textContent = "—"; return td; }
        const w = h("div", "ph");
        w.appendChild(h("span", null, p));
        const call = h("a", "btn g s", "اتصل"); call.href = "tel:" + phoneClean(p);
        const wa = h("a", "btn wa s", "واتساب"); wa.href = "https://wa.me/" + waNum(p); wa.target = "_blank"; wa.rel = "noopener";
        call.addEventListener("click", (e) => e.stopPropagation()); wa.addEventListener("click", (e) => e.stopPropagation());
        w.appendChild(call); w.appendChild(wa); td.appendChild(w);
        return td;
      }
      const gLabel = (g) => g === "male" ? "ذكر" : g === "female" ? "أنثى" : "—";
      const subjOf = (a) => { const e = examOf(a.exam_id); return (e && e.subject) || a.exam_subject || "امتحان محذوف"; };

      function av(url, name, noZoom) {
        const s = h("span", "av");
        const ini = (name || "؟").trim().split(/\s+/).slice(0, 2).map((w) => Array.from(w)[0]).join(" ");
        if (typeof url === "string" && url.indexOf("preset:") === 0 && PRESETS[url.slice(7)]) {
          s.innerHTML = PRESETS[url.slice(7)];
        } else if (url && /^https?:/.test(url)) {
          const i = document.createElement("img"); i.alt = ""; i.referrerPolicy = "no-referrer";
          i.onerror = () => { s.textContent = ini; }; i.src = url; s.appendChild(i);
        } else s.textContent = ini;
        if (!noZoom) {
          s.classList.add("click"); s.title = "اضغط لعرض الصورة كاملة";

        return s;
      }
      const bigUrl = (url) => (url && /googleusercontent\.com/.test(url)) ? url.replace(/=s\d+(-c)?/, "=s800-c") : url;
      function openAvatarFull(url, name) {
        modal((b) => {
          b.appendChild(h("h2", null, name || "طالب"));

          if (typeof url === "string" && url.indexOf("preset:") === 0 && PRESETS[url.slice(7)]) f.innerHTML = PRESETS[url.slice(7)];

        modal((b) => {
          b.appendChild(h("h2", null, title || "صورة"));

      /* ---------- مراجعة تسليم طالب ---------- */
      function reviewData(a) {
        if (Array.isArray(a.review) && a.review.length) return a.review;
        if (a.answers && a.exam_id) {
          const qs = qOf(a.exam_id);
          if (qs.length) return qs.map((q) => ({ body: q.body, kind: q.kind, options: q.options, correct_index: q.correct_index, explanation: q.explanation, image_url: q.image_url, choice: a.answers[q.id] == null ? -1 : Number(a.answers[q.id]) }));
        }
        return null;
      }
      async function gradeSolution(a, idx, mark) {
        const r = await sb.rpc("admin_grade_solution", { p_user: a.user_id, p_exam: a.exam_id, p_idx: idx, p_mark: mark });
        if (r.error) { toast(em(r.error) + " (شغّل update-v3.sql)", true); return; }
        a.review = r.data.review; a.score = r.data.score; a.total = r.data.total; a.passed = r.data.passed;
        toast("اتحفظ التصحيح");
        openReview(a);
        loadAll(true);
      }
      function openReview(a) {
        const s = studOf(a.user_id) || {};
        modal((b) => {
          const w = h("div", "who"); w.appendChild(av(s.avatar_url, s.full_name));
          const d = h("div"); d.appendChild(h("div", "e-title", s.full_name || "حساب غير معروف")); d.appendChild(h("div", "muted", subjOf(a))); w.appendChild(d);
          b.appendChild(w);
          if (s.phone) {
            const pr = h("div", "row");
            pr.appendChild(h("span", "muted", "التليفون: " + s.phone));
            const c1 = h("a", "btn g s", "اتصل"); c1.href = "tel:" + phoneClean(s.phone);
            const c2 = h("a", "btn wa s", "واتساب"); c2.href = "https://wa.me/" + waNum(s.phone); c2.target = "_blank"; c2.rel = "noopener";
            pr.appendChild(c1); pr.appendChild(c2); b.appendChild(pr);
          }
          const r = h("div", "row");
          r.appendChild(h("span", "chip a", fmtNum(a.score) + " / " + fmtNum(a.total)));
          r.appendChild(h("span", "chip " + (a.passed ? "ok" : "w"), a.passed ? "ناجح" : "لم ينجح"));
          if (a.submitted_at) r.appendChild(h("span", "muted", fDT.format(new Date(a.submitted_at))));
          b.appendChild(r);
          const rv = reviewData(a);
          if (!rv) b.appendChild(h("div", "empty", "تفاصيل الإجابات مش محفوظة للتسليم ده (اتسلّم قبل التحديث)."));
          else rv.forEach((q, i) => {
            const c = h("div", "rv-q");
            const top = h("div", "row");
            top.appendChild(h("span", "chip a", "سؤال " + ar(i + 1)));
            if (q.points != null) top.appendChild(h("span", "chip", "الدرجة: " + fmtNum(q.earned == null ? 0 : q.earned) + " / " + fmtNum(q.points)));
            if (q.kind === "solve") top.appendChild(h("span", "chip " + (q.graded ? "ok" : "pend"), q.graded ? "اتصحّح" : "محتاج تصحيح"));
            c.appendChild(top);
            c.appendChild(h("div", "t", q.body));
            if (q.image_url) { const im = h("img", "rv-img"); im.src = q.image_url; im.alt = ""; im.addEventListener("click", () => openImageFull(q.image_url, "صورة السؤال", () => openReview(a))); c.appendChild(im); }
            if (q.kind === "solve") {
              c.appendChild(h("div", "rv-lab", "حل الطالب"));
              if (q.solution_url) { const im = h("img", "rv-img"); im.src = q.solution_url; im.alt = ""; im.addEventListener("click", () => openImageFull(q.solution_url, "حل الطالب", () => openReview(a))); c.appendChild(im); }
              else c.appendChild(h("div", "muted", "الطالب ما رفعش حل."));
              if (q.answer_image_url) {
                c.appendChild(h("div", "rv-lab", "الحل النموذجي"));
                const im = h("img", "rv-img"); im.src = q.answer_image_url; im.alt = ""; im.addEventListener("click", () => openImageFull(q.answer_image_url, "الحل النموذجي", () => openReview(a))); c.appendChild(im);
              }
              if (q.solution_url && a.exam_id) {
                const g = h("div", "rv-grade");
                g.appendChild(btn("صح", "ok s", () => gradeSolution(a, i, "full")));
                g.appendChild(btn("نص درجة", "g s", () => gradeSolution(a, i, "half")));
                g.appendChild(btn("غلط", "d s", () => gradeSolution(a, i, "zero")));
                c.appendChild(g);
              }
            } else {
              const opts = (q.options && q.options.length) ? q.options : ["صح", "غلط"];
              const ch = q.choice == null ? -1 : Number(q.choice);
              opts.forEach((o, k) => {
                const row = h("div", "rv-o" + (k === q.correct_index ? " right" : (k === ch ? " wrong" : "")), String(o));
                if (k === ch) row.appendChild(h("span", "rv-tag", k === q.correct_index ? "← إجابة الطالب ✔" : "← إجابة الطالب ✘"));
                else if (k === q.correct_index) row.appendChild(h("span", "rv-tag", "الإجابة الصحيحة"));
                c.appendChild(row);
              });
              if (ch < 0) c.appendChild(h("div", "muted", "الطالب ما جاوبش (نص درجة)"));
            }
            if (q.explanation) c.appendChild(h("div", "muted", "الشرح: " + q.explanation));
            b.appendChild(c);
          });
          const act = h("div", "actions"); act.style.gridTemplateColumns = "1fr"; act.appendChild(btn("إغلاق", "g", () => closeModal())); b.appendChild(act);
        });

      async function resizeToBlob(file, max) {
        let bmp = null;
        try { bmp = await createImageBitmap(file, { imageOrientation: "from-image" }); } catch (e) { bmp = await createImageBitmap(file); }
        const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
        const c = document.createElement("canvas");
        c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
        c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
        return await new Promise((res) => c.toBlob(res, "image/jpeg", 0.85));
      }

            const tr = h("tr"); const c0 = h("td"); const w = h("div", "who"); w.appendChild(av(x.avatar_url, x.full_name)); w.appendChild(h("div", null, x.full_name || "—")); c0.appendChild(w); tr.appendChild(c0);
            const em2 = h("td", null, x.email || "—"); em2.style.direction = "ltr"; tr.appendChild(em2);
            tr.appendChild(phoneCell(x.phone));
            tr.appendChild(h("td", null, gLabel(x.gender)));
            cols.forEach((c) => {
              const a = S.atts.find((y) => y.user_id === x.id && attKey(y) === c.key && y.submitted_at);
              const td = h("td", a ? (a.passed ? "cell good" : "cell bad") : null, a ? fmtNum(a.score) + " / " + fmtNum(a.total) : "—");
              if (a) td.addEventListener("click", () => openReview(a));
              tr.appendChild(td);
            });
            tb.appendChild(tr);
          });
          t.appendChild(tb); wrap.appendChild(t);
        }
        s.addEventListener("input", fill); fill();
      }

      /* ---------- سجل الخروج ---------- */
      const fWeek = new Intl.DateTimeFormat("ar-EG", { timeZone: "Africa/Cairo", weekday: "long" });
      const fFullDT = new Intl.DateTimeFormat("ar-EG", { timeZone: "Africa/Cairo", day: "numeric", month: "long", year: "numeric", hour: "numeric", minute: "2-digit" });
      const dtCell = (iso) => h("td", null, iso ? fFullDT.format(new Date(iso)) : "—");
      function evTable(m, kind, ttl, note, emptyMsg, withLast, lastLabel) {
        title(m, ttl);
        m.appendChild(h("p", "muted", note));
        const list = S.events.filter((e) => e.kind === kind).slice(0, 300);
        if (!list.length) { m.appendChild(h("div", "empty", emptyMsg)); return; }
        const wrap = h("div", "tbl-wrap"); m.appendChild(wrap);
        const t = h("table"); const hr = h("tr");
        ["الطالب", "الإيميل", "التليفون", "تاريخ التسجيل"].concat(withLast ? ["آخر دخول"] : []).concat(["اليوم", lastLabel]).forEach((x) => hr.appendChild(h("th", null, x)));
        const th = h("thead"); th.appendChild(hr); t.appendChild(th);
        const tb = h("tbody");
        list.forEach((ev) => {
          const x = studOf(ev.user_id) || {};
          const tr = h("tr"); const c0 = h("td"); const w = h("div", "who");
          w.appendChild(av(x.avatar_url, x.full_name)); w.appendChild(h("div", null, x.full_name || "حساب غير معروف")); c0.appendChild(w); tr.appendChild(c0);
          const em2 = h("td", null, x.email || "—"); em2.style.direction = "ltr"; tr.appendChild(em2);
          tr.appendChild(phoneCell(x.phone));
          tr.appendChild(dtCell(x.registered_at));
          if (withLast) tr.appendChild(dtCell(x.last_login));
          tr.appendChild(h("td", null, fWeek.format(new Date(ev.created_at))));
          tr.appendChild(dtCell(ev.created_at));
          tb.appendChild(tr);
        });
        t.appendChild(tb); wrap.appendChild(t);
      }
      function rLogins(m) {
        evTable(m, "login", "سجل الدخول", "كل مرة طالب يدخل الموقع بجلسة جديدة بتتسجل هنا بالتاريخ والوقت (آخر ٣٠ يوم، وبحد أقصى ٣٠٠ سطر).", "لسه مفيش دخول مسجّل. لازم ترفع home.html الجديد وتشغّل update-v5.sql.", false, "وقت الدخول");
      }
      function rLogouts(m) {
        evTable(m, "logout", "سجل الخروج", "كل مرة طالب يضغط «تسجيل الخروج» بتتسجل هنا (آخر ٣٠ يوم، وبحد أقصى ٣٠٠ سطر). لو قفل المتصفح من غير ما يضغط خروج مش بيتسجل.", "لسه محدش سجّل خروج. (لازم تشغّل update-v5.sql الأول)", true, "وقت الخروج");
      }

      /* ---------- إحصائيات الدخول والخروج (الرئيسية) ---------- */
      const fDayKey = new Intl.DateTimeFormat("en-CA", { timeZone: "Africa/Cairo", year: "numeric", month: "2-digit", day: "2-digit" });
      const fChartDay = new Intl.DateTimeFormat("ar-EG", { timeZone: "Africa/Cairo", day: "numeric", month: "long" });
      const fSmallDT = new Intl.DateTimeFormat("ar-EG", { timeZone: "Africa/Cairo", day: "numeric", month: "short", hour: "numeric", minute: "2-digit" });
      function activityStats(n) {
        const days = [], seen = {}, now0 = Date.now();
        for (let i = n - 1; i >= 0; i--) { const d = new Date(now0 - i * 86400e3), k = fDayKey.format(d); if (!seen[k]) { seen[k] = days.length; days.push({ key: k, date: d }); } }
        const login = days.map(() => 0), logout = days.map(() => 0), uniq = days.map(() => ({})), per = {}, everyone = {};
        S.events.forEach((ev) => {
          const i = seen[fDayKey.format(new Date(ev.created_at))];
          if (i == null || (ev.kind !== "login" && ev.kind !== "logout")) return;
          const p = per[ev.user_id] || (per[ev.user_id] = { id: ev.user_id, nin: 0, nout: 0, last: ev.created_at });
          if (ev.kind === "login") { login[i]++; uniq[i][ev.user_id] = 1; everyone[ev.user_id] = 1; p.nin++; } else { logout[i]++; p.nout++; }
          if (new Date(ev.created_at) > new Date(p.last)) p.last = ev.created_at;
        });
        const sum = (a) => a.reduce((x, y) => x + y, 0);
        return { days: days, login: login, logout: logout, uniq: uniq.map((o) => Object.keys(o).length), per: Object.keys(per).map((k) => per[k]), totalIn: sum(login), totalOut: sum(logout), people: Object.keys(everyone).length };
      }
      function insightsCard(m) {
        const st = activityStats(S.range);
        const card = h("div", "card ins");
        const top = h("div", "ins-top");
        const rg = h("div", "ins-range");
        rg.insertAdjacentHTML("beforeend", IC.cal);
        const rt = h("div"); rt.appendChild(h("b", null, "آخر " + ar(S.range) + (S.range === 7 ? " أيام" : " يوم")));
        rt.appendChild(h("span", null, fChartDay.format(st.days[0].date) + " - " + fChartDay.format(st.days[st.days.length - 1].date)));
        rg.appendChild(rt); top.appendChild(rg);
        const seg = h("div", "seg ins-seg");
        [[7, "٧ أيام"], [30, "٣٠ يوم"]].forEach((o) => {
          const b = h("button", null, o[1]); b.type = "button"; b.setAttribute("aria-pressed", S.range === o[0] ? "true" : "false");
          b.addEventListener("click", () => { S.range = o[0]; S.showAll = false; render(); });
          seg.appendChild(b);
        });
        top.appendChild(seg); card.appendChild(top);

        const body = h("div", "ins-body");
        const hh = h("h2", "ins-h", "الدخول والخروج"); body.appendChild(hh);
        [["blue", "طلاب دخلوا (من غير تكرار)", st.people], ["green", "مرات الدخول", st.totalIn], ["red", "مرات الخروج", st.totalOut]].forEach((r) => {
          const row = h("div", "ins-row"); row.appendChild(h("span", "dot " + r[0])); row.appendChild(h("span", "lbl", r[1])); row.appendChild(h("b", null, ar(r[2]))); body.appendChild(row);
        });

        /* الرسم البياني */
        const NS = "http://www.w3.org/2000/svg", W = 360, HT = 210, L = 30, R = 10, T = 10, B = 26, pw = W - L - R, ph = HT - T - B, n = st.days.length;
        const mx = Math.max.apply(null, st.uniq.concat(st.login, st.logout, [0]));
        const ymax = Math.max(4, Math.ceil(mx / 4) * 4);
        const X = (i) => L + (n === 1 ? pw / 2 : (i * pw) / (n - 1)), Y = (v) => T + ph * (1 - v / ymax);
        const el = (tag, at, tx) => { const e = document.createElementNS(NS, tag); for (const k in at) e.setAttribute(k, at[k]); if (tx != null) e.textContent = tx; return e; };
        const svgEl = el("svg", { viewBox: "0 0 " + W + " " + HT, role: "img", "aria-label": "رسم بياني للدخول والخروج" });
        for (let g = 0; g <= 4; g++) { const y = Y((ymax * g) / 4); svgEl.appendChild(el("line", { x1: L, x2: W - R, y1: y, y2: y, class: "gl" })); svgEl.appendChild(el("text", { x: L - 6, y: y + 4, "text-anchor": "end" }, ar((ymax * g) / 4))); }
        [[0, "start"], [Math.floor((n - 1) / 2), "middle"], [n - 1, "end"]].forEach((q) => { if (n > 1 || q[0] === 0) svgEl.appendChild(el("text", { x: X(q[0]), y: HT - 6, "text-anchor": q[1] }, fChartDay.format(st.days[q[0]].date))); });
        const mk = el("line", { class: "mk", y1: T, y2: T + ph, x1: 0, x2: 0, visibility: "hidden" }); svgEl.appendChild(mk);
        [["blue", st.uniq], ["green", st.login], ["red", st.logout]].forEach((sr) => {
          svgEl.appendChild(el("path", { class: "ln " + sr[0], d: sr[1].map((v, i) => (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(v).toFixed(1)).join(" ") }));
        });
        const readout = h("p", "readout", "اضغط على أي يوم في الرسم لتفاصيله.");
        const show = (i) => { mk.setAttribute("x1", X(i)); mk.setAttribute("x2", X(i)); mk.setAttribute("visibility", "visible"); readout.textContent = fChartDay.format(st.days[i].date) + " — دخول: " + ar(st.login[i]) + " · خروج: " + ar(st.logout[i]) + " · طلاب مختلفين: " + ar(st.uniq[i]); };
        const cw = n > 1 ? pw / (n - 1) : pw;
        for (let i = 0; i < n; i++) { const r = el("rect", { class: "hit", x: X(i) - cw / 2, y: T, width: cw, height: ph }); r.addEventListener("pointerenter", () => show(i)); r.addEventListener("click", () => show(i)); svgEl.appendChild(r); }
        const ch = h("div", "chart"); ch.appendChild(svgEl); body.appendChild(ch); body.appendChild(readout);
        if (!S.events.length) body.appendChild(h("p", "muted", "لسه مفيش نشاط مسجّل. ارفع home.html الجديد وشغّل update-v5.sql وبعدها هتظهر الأرقام هنا."));

        /* قايمة الطلاب */
        body.appendChild(h("h3", "act-h", "الطلاب: دخول وخروج"));
        const rows = st.per.slice().sort((a, b) => (b.nin + b.nout) - (a.nin + a.nout) || new Date(b.last) - new Date(a.last));
        if (!rows.length) body.appendChild(h("div", "muted", "مفيش دخول أو خروج في الفترة دي."));
        (S.showAll ? rows : rows.slice(0, 8)).forEach((p) => {
          const s = studOf(p.id) || {}; const row = h("div", "act-row"); const w = h("div", "who"); w.appendChild(av(s.avatar_url, s.full_name));
          const d = h("div"); d.appendChild(h("div", null, s.full_name || "حساب غير معروف")); d.appendChild(h("small", null, "آخر نشاط: " + fSmallDT.format(new Date(p.last)))); w.appendChild(d);
          row.appendChild(w); row.appendChild(h("span", "chip ok", "دخول " + ar(p.nin))); row.appendChild(h("span", "chip red", "خروج " + ar(p.nout))); body.appendChild(row);
        });
        if (rows.length > 8) { const more = btn(S.showAll ? "عرض أقل" : "عرض الكل (" + ar(rows.length) + ")", "g s", () => { S.showAll = !S.showAll; render(); }); more.style.marginTop = "8px"; body.appendChild(more); }
        card.appendChild(body); m.appendChild(card);
      }

      /* ---------- الإشعارات ---------- */
      function rNotifs(m) {
        title(m, "الإشعارات");
        const c = h("div", "card stack"); c.style.marginBottom = "16px";
        const mk = (l, el) => { const w = h("label", "fld"); w.appendChild(h("span", null, l)); w.appendChild(el); c.appendChild(w); return el; };
        const t = mk("عنوان الإشعار", h("input", "inp")), bd = mk("نص الإشعار (اختياري)", h("textarea", "inp"));
        const er = h("p", "err"); c.appendChild(er);
        const send = btn("إرسال لكل الطلاب", "p", async () => {
          if (!t.value.trim()) { er.textContent = "اكتب عنوان."; return; }
          send.disabled = true;
          const r = await sb.from("notifications").insert({ title: t.value.trim(), body: bd.value.trim() || null });
          send.disabled = false;
          if (r.error) { er.textContent = em(r.error); return; }
          toast("اتبعت الإشعار"); loadAll();
        });
        c.appendChild(send); m.appendChild(c);
        if (!S.notifs.length) { m.appendChild(h("div", "empty", "مفيش إشعارات.")); return; }
        const g = h("div", "grid");
        S.notifs.forEach((n) => {
          const d = h("div", "card"); d.appendChild(h("div", "e-title", n.title)); if (n.body) d.appendChild(h("div", "muted", n.body));
          d.appendChild(h("div", "muted", fDT.format(new Date(n.created_at))));
          const r = h("div", "row"); r.style.marginTop = "8px";
          r.appendChild(btn("حذف", "d s", async () => { const x = await sb.from("notifications").delete().eq("id", n.id); if (x.error) toast(em(x.error), true); else loadAll(); }));
          d.appendChild(r); g.appendChild(d);
        });
        m.appendChild(g);
      }

      /* ---------- الإعدادات ---------- */
      function rSettings(m) {
        title(m, "إعدادات الأدمن");
        const st = h("div", "stack");
        const c1 = h("div", "card");
        const lab = h("label", "toggle"); lab.appendChild(h("span", null, "الوضع الداكن"));
        const cb = h("input"); cb.type = "checkbox"; cb.checked = window.QBA.dark(); lab.appendChild(cb); lab.appendChild(h("span", "tk"));
        cb.addEventListener("change", () => { const n = cb.checked ? "dark" : "light"; document.documentElement.setAttribute("data-theme", n); try { localStorage.setItem("qb-theme", n); } catch (e) {} window.QBA.apply(); render(); });
        c1.appendChild(lab); st.appendChild(c1);
        const c2 = h("div", "card"); c2.appendChild(h("p", "muted", "لون الأزرار")); const sw = h("div", "sw");
        let cur = "blue"; try { cur = localStorage.getItem("qb-accent") || "blue"; } catch (e) {}
        Object.keys(window.QBA.ACC).forEach((k) => {
          const b = h("button"); b.type = "button"; b.style.background = window.QBA.dark() ? window.QBA.ACC[k][1] : window.QBA.ACC[k][0]; b.setAttribute("aria-pressed", k === cur ? "true" : "false"); b.setAttribute("aria-label", k);
          b.addEventListener("click", () => { try { localStorage.setItem("qb-accent", k); } catch (e) {} window.QBA.apply(); render(); }); sw.appendChild(b);
        });
        c2.appendChild(sw); st.appendChild(c2);
        const c3 = h("div", "card stack"); c3.appendChild(btn("الرجوع للموقع", "g", () => go(HOME_PAGE)));
        c3.appendChild(btn("تسجيل الخروج", "d", async () => { if (await ask("تسجيل الخروج", "متأكد إنك عايز تسجّل خروج؟", "تأكيد", true)) { try { const ss = (await sb.auth.getSession()).data.session; if (ss) { try { sessionStorage.removeItem("qb-logged-" + ss.user.id); } catch (e2) {} await sb.from("user_events").insert({ user_id: ss.user.id, kind: "logout" }); } } catch (e) {} try { await sb.auth.signOut(); } catch (e) {} go(LOGIN_PAGE); } }));
        st.appendChild(c3); m.appendChild(st);
      }

      /* ---------- تشغيل ---------- */
      (async function () {
        let s = null;
        try { s = (await sb.auth.getSession()).data.session; } catch (e) {}
        if (!s) { go(LOGIN_PAGE); return; }
        if (ADMIN_EMAILS.indexOf((s.user.email || "").toLowerCase()) === -1) { go(HOME_PAGE); return; }
        buildNav();
        $("boot").hidden = true; $("app").hidden = false;
        render();
        loadAll();
        // تحديث تلقائي: الصور والتسليمات الجديدة تظهر من غير ريفريش
        setInterval(() => { if (!document.hidden) loadAll(true); }, 30000);
        document.addEventListener("visibilitychange", () => { if (!document.hidden) loadAll(true); });
      })();
      sb.auth.onAuthStateChange((e) => { if (e === "SIGNED_OUT") go(LOGIN_PAGE); });
    })();
  </script>
</body>
